<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>损坏复盘 · 剧组版</title>
<style>
  :root{--bg:#fafafa;--surface:#fff;--hair:#e2e2e2;--text:#1a1a1a;--muted:#9a9a9a;--accent:#002FA7;--accent-soft:#EEF2FB;--warn:#D4392B;--warn-bg:#FBEDEB;--good:#3B6D11;--good-bg:#EAF3DE;--r-zsh:#002FA7;--r-nar:#6a6a6a}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .slide{width:min(980px,95vw);height:min(660px,93vh);display:flex;flex-direction:column;gap:0;padding:38px 46px;position:relative}
  header.sl-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:14px}
  header.sl-h h1{font-size:24px;font-weight:500}.crumb{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}.crumb b{color:var(--accent);font-weight:500}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;gap:30px}
  .file{border:1px solid var(--hair);background:var(--surface);width:380px;opacity:0;transform:translateY(10px);transition:.4s}
  .file.show{opacity:1;transform:none}
  .file .fh{padding:12px 16px;border-bottom:1px solid var(--hair);font-family:"SF Mono",Menlo,monospace;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
  .file .fh .ic{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.7}
  .file .code{padding:14px 16px;font-family:"SF Mono",Menlo,monospace;font-size:13px;line-height:2.2}
  .file .code .ln{display:block;padding-left:20px;position:relative;transition:.3s}
  .file .code .ln::before{content:attr(data-n);position:absolute;left:0;color:var(--muted);font-size:11px;width:14px;text-align:right}
  .file .code .ln.err{color:var(--warn);background:var(--warn-bg)}
  .file .code .ln.err::before{color:var(--warn)}
  .file .code .ln.fix{color:var(--good)}
  .file .code .ln.fix::before{color:var(--good)}
  .checks{display:flex;flex-direction:column;gap:14px;width:280px}
  .check{border:1px solid var(--hair);padding:16px 18px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(10px);transition:.4s}
  .check.show{opacity:1;transform:none}
  .check .cmd{font-family:"SF Mono",Menlo,monospace;font-size:13px;font-weight:500}
  .check .out{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--muted);padding:6px 10px;background:#f6f6f6}
  .check.bad{border-color:var(--warn);background:var(--warn-bg)}
  .check.bad .cmd,.check.bad .out{color:var(--warn)}
  .check.good{border-color:var(--good);background:var(--good-bg)}
  .check.good .cmd,.check.good .out{color:var(--good)}
  .check .ic{width:18px;height:18px;display:inline-block;vertical-align:-3px}
  .dialogue{border-left:3px solid var(--r-nar);padding:14px 0 14px 18px;min-height:84px;margin-top:14px;transition:border-color .3s}
  .dialogue[data-role="zsh"]{border-color:var(--r-zsh)}.dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .speaker{font-size:13px;letter-spacing:.3px;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:500;color:var(--r-nar)}
  .dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
  .speaker .spk-ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px;border:1px solid currentColor;font-size:11px;letter-spacing:.4px}
  .type-text{font-size:18px;line-height:1.7;min-height:30px}
  .type-cursor{display:inline-block;width:9px;height:20px;background:var(--r-nar);vertical-align:-4px;margin-left:2px;animation:blink .7s step-end infinite}
  .dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px;color:var(--accent);letter-spacing:.5px;margin-top:10px;opacity:0;transition:.3s}
  .continue.show{opacity:1;animation:pulse 1.4s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .progress{position:absolute;top:14px;right:20px;display:flex;gap:4px}.progress .dot{width:18px;height:3px;background:var(--hair);transition:.3s}.progress .dot.on{background:var(--accent)}
  .replay-btn{position:absolute;bottom:14px;right:20px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 16px;font-size:12px;cursor:pointer;border-radius:0;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;z-index:5}.replay-btn:hover{background:var(--accent);color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="16-引号类型-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="18-Starship-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-file" viewBox="0 0 24 24"><path d="M6 3 h8 l4 4 v14 h-12 z M14 3 v4 h4" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.7"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="slide">
  <header class="sl-h"><h1>损坏复盘 + zsh -n 自检</h1><div class="crumb">场 17 · <b>自检</b></div></header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="stage">
    <div class="file" id="file">
      <div class="fh"><svg class="ic"><use href="#ic-file"/></svg>~/.zshrc</div>
      <div class="code">
        <span class="ln err" data-n="1">expert NVM_DIR="$HOME/.nvm"</span>
        <span class="ln err" data-n="2">[ -s "$NVM_DIR/nvm.sh ] && \.</span>
        <span class="ln" data-n="3" id="ln3">...</span>
      </div>
    </div>
    <div class="checks" id="checks">
      <div class="check bad" data-i="0"><div class="cmd">$ zsh -n ~/.zshrc</div><div class="out">✕ 语法错：expert 命令找不到 + 引号未闭合</div></div>
      <div class="check" data-i="1"><div class="cmd"># 修正：expert→export + 补引号</div><div class="out">export NVM_DIR=...<br>[ -s "$NVM_DIR/nvm.sh" ] && \.</div></div>
      <div class="check good" data-i="2"><div class="cmd">$ zsh -n ~/.zshrc && echo OK</div><div class="out">✓ 语法 OK</div></div>
    </div>
  </div>
  <div class="dialogue" id="dlg" data-role="narrator"><div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div><span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span><div class="continue" id="cont">Action ▸</div></div>
  <button class="replay-btn" onclick="event.stopPropagation();reset();advance();">NG · 再拍一条</button>
</div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')],file=document.getElementById('file'),checks=[...document.querySelectorAll('.check')];
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),tt=document.getElementById('tt'),cont=document.getElementById('cont');
let step=0,typing=false,typeTimer=null,pending=null,lock=false,curText='';const TOTAL=6;
function setDots(n){dots.forEach((d,j)=>d.classList.toggle('on',j<n));}
function setSpeaker(r,l,i){dlg.dataset.role=r;spk.innerHTML='<svg class="spk-ic"><use href="#'+i+'"/></svg><span class="spk-nm">'+l+'</span>';}
function typeSpeak(r,l,i,t){curText=t;return new Promise(res=>{pending=res;typing=true;setSpeaker(r,l,i);tt.textContent='';cont.classList.remove('show');let k=0;typeTimer=setInterval(()=>{tt.textContent=t.slice(0,++k);if(k>=t.length){clearInterval(typeTimer);typing=false;cont.classList.add('show');pending=null;res();}},42);});}
function fast(){if(!typing)return false;clearInterval(typeTimer);tt.textContent=curText;typing=false;cont.classList.add('show');if(pending){const r=pending;pending=null;r();}return true;}
async function goStep(n){setDots(n);
  if(n===1){file.classList.add('show');await wait(500);await typeSpeak('narrator','场务','ic-bubble','这场复盘你那次损坏——expert 写错，引号也没闭合。');}
  else if(n===2){checks[0].classList.add('show');await wait(500);await typeSpeak('narrator','场务','ic-bubble','改完别急着重开终端——先用 zsh -n 查语法，不执行只查。');}
  else if(n===3){await typeSpeak('zsh','zsh','ic-terminal','我拦住了——语法错在 expert 那行，还有引号没闭合。');}
  else if(n===4){checks[1].classList.add('show');await wait(500);await typeSpeak('narrator','场务','ic-bubble','修正：expert 改回 export，补上引号。');}
  else if(n===5){checks[2].classList.add('show');await wait(500);await typeSpeak('narrator','场务','ic-bubble','再查一次：zsh -n 通过，绿勾——可以 source 生效了。');}
  else if(n===6){await typeSpeak('narrator','场务','ic-bubble','防御四招：备份 → zsh -n 检查 → source 试跑 → 出错一键还原。下一场，装 Starship 把学的串起来练。');cont.textContent='Action · 下一场 ▸';cont.classList.add('show');}
}
function reset(){step=0;lock=false;file.classList.remove('show');checks.forEach(c=>c.classList.remove('show'));setDots(0);setSpeaker('narrator','场务','ic-bubble');tt.textContent='喊 Action 开拍';cont.classList.remove('show');cont.textContent='Action ▸';}
async function advance(){if(lock)return;if(fast())return;if(step>=TOTAL)reset();step++;lock=true;await goStep(step);lock=false;}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){e.preventDefault();advance();}});
</script>
</body>
</html>
