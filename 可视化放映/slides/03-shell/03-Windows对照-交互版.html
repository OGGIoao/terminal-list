<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 对照 · 剧组版</title>
<style>
  :root{
    --bg:#fafafa; --surface:#fff; --hair:#e2e2e2;
    --text:#1a1a1a; --muted:#9a9a9a;
    --accent:#002FA7; --accent-bg:#E6EBF5; --accent-soft:#EEF2FB;
    --warn:#D4392B; --warn-bg:#FBEDEB;
    --good:#3B6D11; --good-bg:#EAF3DE;
    --r-zsh:#002FA7; --r-nar:#6a6a6a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;
  }
  .slide{
    width:min(980px,95vw); height:min(660px,93vh);
    display:flex; flex-direction:column; gap:0; padding:38px 46px; position:relative;
  }
  header.sl-h{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--hair); padding-bottom:16px; margin-bottom:14px;
  }
  header.sl-h h1{font-size:24px; font-weight:500; letter-spacing:.2px}
  header.sl-h .crumb{font-size:12px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase}
  header.sl-h .crumb b{color:var(--accent); font-weight:500}

  .stage{flex:1; display:flex; align-items:center; justify-content:center}
  .compare{display:flex; gap:0; width:100%; border:1px solid var(--hair)}
  .col{flex:1; display:flex; flex-direction:column}
  .col + .col{border-left:1px solid var(--hair)}
  .col-head{
    padding:14px 18px; border-bottom:1px solid var(--hair);
    font-size:14px; font-weight:500; letter-spacing:.3px;
    display:flex; align-items:center; gap:8px;
  }
  .col-head .badge{font-size:10px; padding:1px 7px; border:1px solid currentColor; letter-spacing:.5px}
  .col-mac .col-head{color:var(--accent); background:var(--accent-soft)}
  .col-win .col-head{color:var(--text); background:var(--surface)}
  .row{
    padding:18px 18px; border-bottom:1px solid var(--hair);
    display:flex; align-items:center; gap:12px;
    transition:background .35s, opacity .4s;
    opacity:0; transform:translateY(8px); min-height:74px;
  }
  .row:last-child{border-bottom:none}
  .row.show{opacity:1; transform:none}
  .row .ic{width:26px; height:26px; stroke:var(--muted); fill:none; stroke-width:1.6; transition:stroke .3s; flex-shrink:0}
  .row .body{flex:1}
  .row .label{font-size:11px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; margin-bottom:3px}
  .row .val{font-size:14px; font-weight:500}
  .row .note{font-size:11px; color:var(--muted); margin-top:2px}
  .row.lit{background:var(--accent-soft)}
  .col-mac .row.lit .ic, .col-mac .row.lit .val{stroke:var(--accent); color:var(--accent)}
  .col-win .row.lit .ic, .col-win .row.lit .val{color:var(--text)}
  .col-win .row.lit{background:#f4f4f4}
  .row.diff-mac{background:var(--good-bg)}
  .row.diff-mac .ic, .row.diff-mac .val{stroke:var(--good); color:var(--good)}
  .row.diff-win{background:var(--warn-bg)}
  .row.diff-win .ic, .row.diff-win .val{stroke:var(--warn); color:var(--warn)}
  .wsl-band{
    margin-top:14px; border:1px solid var(--good); background:var(--good-bg);
    padding:12px 16px; display:flex; align-items:center; gap:10px;
    opacity:0; transform:translateY(8px); transition:.4s;
  }
  .wsl-band.show{opacity:1; transform:none}
  .wsl-band .ic{width:22px; height:22px; stroke:var(--good); fill:none; stroke-width:1.8}
  .wsl-band .txt{font-size:13.5px; color:var(--good); font-weight:500}
  .wsl-band .txt b{font-weight:600}

  .dialogue{
    border-left:3px solid var(--r-nar); padding:14px 0 14px 18px;
    min-height:84px; margin-top:14px; transition:border-color .3s;
  }
  .dialogue[data-role="zsh"]{border-color:var(--r-zsh)}
  .dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .speaker{
    font-size:13px; letter-spacing:.3px;
    display:flex; align-items:center; gap:7px; margin-bottom:8px; font-weight:500; color:var(--r-nar);
  }
  .dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
  .speaker .spk-ic{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px; border:1px solid currentColor; font-size:11px; letter-spacing:.4px}
  .type-text{font-size:18px; line-height:1.7; min-height:30px}
  .type-cursor{display:inline-block; width:9px; height:20px; background:var(--r-nar); vertical-align:-4px; margin-left:2px; animation:blink .7s step-end infinite}
  .dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px; color:var(--accent); letter-spacing:.5px; margin-top:10px; opacity:0; transition:.3s}
  .continue.show{opacity:1; animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4} 50%{opacity:1}}
  .progress{position:absolute; top:14px; right:20px; display:flex; gap:4px}
  .progress .dot{width:18px; height:3px; background:var(--hair); transition:.3s}
  .progress .dot.on{background:var(--accent)}
  .replay-btn{position:absolute; bottom:14px; right:20px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:7px 16px; font-size:12px; cursor:pointer; border-radius:0; letter-spacing:.5px; text-transform:uppercase; font-family:inherit; z-index:5}
  .replay-btn:hover{background:var(--accent); color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="02-三层概念-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="04-家族史-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.6"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-shell" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke-width="1.6"/><path d="M7 9 l3 3 -3 3" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-pipe" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="6" fill="none" stroke-width="1.6"/><rect x="8" y="15" width="8" height="6" fill="none" stroke-width="1.6"/><line x1="12" y1="9" x2="12" y2="15" stroke-width="1.6"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="1.8"/><path d="M8 12 l3 3 5-6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="slide">
  <header class="sl-h">
    <h1>Windows 那边，又是另一套</h1>
    <div class="crumb">场 03 · <b>分屏</b></div>
  </header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="stage">
    <div style="width:100%">
      <div class="compare">
        <div class="col col-mac">
          <div class="col-head">macOS <span class="badge">Unix 脉</span></div>
          <div class="row" data-row="terminal"><svg class="ic"><use href="#ic-terminal"/></svg><div class="body"><div class="label">终端</div><div class="val">Terminal.app / iTerm2</div></div></div>
          <div class="row" data-row="shell"><svg class="ic"><use href="#ic-shell"/></svg><div class="body"><div class="label">Shell</div><div class="val">zsh</div></div></div>
          <div class="row" data-row="tty"><svg class="ic"><use href="#ic-pipe"/></svg><div class="body"><div class="label">TTY</div><div class="val">真 pty</div><div class="note">内核里的虚拟终端</div></div></div>
        </div>
        <div class="col col-win">
          <div class="col-head">Windows <span class="badge">NT 脉</span></div>
          <div class="row" data-row="terminal"><svg class="ic"><use href="#ic-terminal"/></svg><div class="body"><div class="label">终端</div><div class="val">Windows Terminal</div></div></div>
          <div class="row" data-row="shell"><svg class="ic"><use href="#ic-shell"/></svg><div class="body"><div class="label">Shell</div><div class="val">PowerShell / CMD</div></div></div>
          <div class="row" data-row="tty"><svg class="ic"><use href="#ic-pipe"/></svg><div class="body"><div class="label">TTY</div><div class="val">console（传统无 TTY）</div><div class="note">用控制台代替</div></div></div>
        </div>
      </div>
      <div class="wsl-band" id="wsl">
        <svg class="ic"><use href="#ic-check"/></svg>
        <div class="txt">但 <b>WSL2</b> 里开的 shell 有真 TTY——行为和 Mac 一致，这就是它适合练本课程的原因。</div>
      </div>
    </div>
  </div>

  <div class="dialogue" id="dlg" data-role="narrator">
    <div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div>
    <span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span>
    <div class="continue" id="cont">Action ▸</div>
  </div>
  <button class="replay-btn" onclick="event.stopPropagation(); reset(); advance();">NG · 再拍一条</button>
</div>

<script>
const wait = ms => new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')];
const macRows=[...document.querySelectorAll('.col-mac .row')];
const winRows=[...document.querySelectorAll('.col-win .row')];
const wsl=document.getElementById('wsl');
const dlg=document.getElementById('dlg'), spk=document.getElementById('spk'), tt=document.getElementById('tt'), cont=document.getElementById('cont');

let step=0, typing=false, typeTimer=null, pending=null, lock=false, curText='';
const TOTAL=6;

function setDots(n){ dots.forEach((d,j)=>d.classList.toggle('on', j<n)); }
function setSpeaker(role,label,icon){ dlg.dataset.role=role; spk.innerHTML='<svg class="spk-ic"><use href="#'+icon+'"/></svg><span class="spk-nm">'+label+'</span>'; }
function litRow(i){ macRows[i].classList.add('show','lit'); winRows[i].classList.add('show','lit'); }

function typeSpeak(role,label,icon,text){
  curText=text;
  return new Promise(res=>{
    pending=res; typing=true; setSpeaker(role,label,icon);
    tt.textContent=''; cont.classList.remove('show');
    let i=0;
    typeTimer=setInterval(()=>{
      tt.textContent=text.slice(0,++i);
      if(i>=text.length){ clearInterval(typeTimer); typing=false; cont.classList.add('show'); pending=null; res(); }
    },42);
  });
}
function fastFinish(){
  if(!typing) return false;
  clearInterval(typeTimer); tt.textContent=curText; typing=false; cont.classList.add('show');
  if(pending){ const r=pending; pending=null; r(); } return true;
}

async function goStep(n){
  setDots(n);
  if(n===1){
    await typeSpeak('narrator','场务','ic-bubble','这场我搭了左右两套布景——同一个「终端」，两边里头不一样。');
  } else if(n===2){
    litRow(0);
    await typeSpeak('narrator','场务','ic-bubble','窗口程序，两边都有，差不多。');
  } else if(n===3){
    litRow(1);
    await typeSpeak('zsh','zsh','ic-terminal','Shell 不同——我是 zsh，Windows 那边是 PowerShell 或 CMD。');
  } else if(n===4){
    litRow(2);
    macRows[2].classList.add('diff-mac'); macRows[2].classList.remove('lit');
    winRows[2].classList.add('diff-win'); winRows[2].classList.remove('lit');
    await typeSpeak('narrator','场务','ic-bubble','关键差异在这——Mac 有真 TTY，Windows 传统用 console 代替。');
  } else if(n===5){
    wsl.classList.add('show');
    await typeSpeak('narrator','场务','ic-bubble','但 WSL2 里的 shell 有真 TTY，行为和 Mac 一致——这就是它适合练本课程的原因。');
  } else if(n===6){
    await typeSpeak('narrator','场务','ic-bubble','Shell 这条线，两边也是各自演化来的……下场上新景了。');
    cont.textContent='Action · 下一场 ▸'; cont.classList.add('show');
  }
}

function reset(){
  step=0; lock=false;
  [...document.querySelectorAll('.row')].forEach(r=>r.classList.remove('show','lit','diff-mac','diff-win'));
  wsl.classList.remove('show');
  setDots(0); setSpeaker('narrator','场务','ic-bubble'); tt.textContent='喊 Action 开拍'; cont.classList.remove('show'); cont.textContent='Action ▸';
}
async function advance(){
  if(lock) return;
  if(fastFinish()) return;
  if(step>=TOTAL){ reset(); }
  step++; lock=true;
  await goStep(step);
  lock=false;
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ e.preventDefault(); advance(); }
});
</script>
</body>
</html>
