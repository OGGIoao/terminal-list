<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>export 机制 · 剧组版</title>
<style>
:root{--bg:#fafafa;--surface:#fff;--hair:#e2e2e2;--text:#1a1a1a;--muted:#9a9a9a;--accent:#002FA7;--accent-soft:#EEF2FB;--warn:#D4392B;--warn-bg:#FBEDEB;--good:#3B6D11;--r-zsh:#002FA7;--r-nar:#6a6a6a}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.slide{width:min(980px,95vw);height:min(660px,93vh);display:flex;flex-direction:column;gap:0;padding:38px 46px;position:relative}
header.sl-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:14px}
header.sl-h h1{font-size:24px;font-weight:500}.crumb{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}.crumb b{color:var(--accent);font-weight:500}
.stage{flex:1;display:flex;align-items:center;justify-content:center}
.ptree{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:560px}
.pnode{border:1px solid var(--hair);background:var(--surface);padding:16px 28px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(8px);transition:.4s}
.pnode.show{opacity:1;transform:none}
.pnode .ic{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:1.7;transition:stroke .3s}
.pnode .nm{font-size:14px;font-weight:500}
.pnode .var{font-family:"SF Mono",Menlo,monospace;font-size:12px;padding:3px 9px;border:1px solid var(--hair);color:var(--muted);transition:.3s}
.pnode.parent.lit{border-color:var(--accent);background:var(--accent-soft)}
.pnode.parent.lit .ic,.pnode.parent.lit .nm{stroke:var(--accent);color:var(--accent)}
.pnode.parent.lit .var{border-color:var(--accent);color:var(--accent)}
.pnode.parent.hold .var{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.link{width:2px;height:46px;background:var(--hair);position:relative;transition:background .4s}
.link .flow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:"SF Mono",Menlo,monospace;font-size:11px;padding:2px 8px;background:var(--bg);color:var(--muted);transition:.3s;white-space:nowrap}
.link.broken{background:repeating-linear-gradient(to bottom,var(--warn) 0 6px,transparent 6px 12px)}
.link.broken .flow{color:var(--warn)}
.link.flowing{background:var(--accent)}
.link.flowing .flow{color:var(--accent);border:1px solid var(--accent)}
.children{display:flex;gap:14px}
.child{border:1px solid var(--hair);background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(8px);transition:.4s;min-width:90px}
.child.show{opacity:1;transform:none}
.child .ic{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.7;transition:stroke .3s}
.child .nm{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--muted);transition:color .3s}
.child .got{font-size:10px;color:var(--muted);transition:.3s}
.child.blind{opacity:.45}
.child.fed{border-color:var(--accent);background:var(--accent-soft)}
.child.fed .ic,.child.fed .nm{stroke:var(--accent);color:var(--accent)}
.child.fed .got{color:var(--good)}
.dialogue{border-left:3px solid var(--r-nar);padding:14px 0 14px 18px;min-height:84px;margin-top:14px;transition:border-color .3s}
.dialogue[data-role="zsh"]{border-color:var(--r-zsh)}.dialogue[data-role="narrator"]{border-color:var(--r-nar)}
.speaker{font-size:13px;letter-spacing:.3px;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:500;color:var(--r-nar)}
.dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
.speaker .spk-ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.speaker .spk-nm{padding:2px 9px;border:1px solid currentColor;font-size:11px;letter-spacing:.4px}
.type-text{font-size:18px;line-height:1.7;min-height:30px}
.type-cursor{display:inline-block;width:9px;height:20px;background:var(--r-nar);vertical-align:-4px;margin-left:2px;animation:blink .7s step-end infinite}
.dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
@keyframes blink{50%{opacity:0}}
.continue{font-size:12px;color:var(--accent);letter-spacing:.5px;margin-top:10px;opacity:0;transition:.3s}
.continue.show{opacity:1;animation:pulse 1.4s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.progress{position:absolute;top:14px;right:20px;display:flex;gap:4px}.progress .dot{width:18px;height:3px;background:var(--hair);transition:.3s}.progress .dot.on{background:var(--accent)}
.replay-btn{position:absolute;bottom:14px;right:20px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 16px;font-size:12px;cursor:pointer;border-radius:0;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;z-index:5}.replay-btn:hover{background:var(--accent);color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="10-写错文件-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="12-每进程独立-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.7"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="ic-block" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke-width="1.7"/><rect x="9" y="9" width="6" height="6" fill="none" stroke-width="1.7"/></symbol>
<symbol id="ic-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="none" stroke-width="1.7"/><rect x="9" y="9" width="6" height="6" fill="none" stroke-width="1.7"/></symbol>
</defs></svg>
<div class="slide">
<header class="sl-h"><h1>export：把变量传给子进程</h1><div class="crumb">场 11 · <b>export</b></div></header>
<div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="stage">
<div class="ptree">
<div class="pnode parent" id="parent"><svg class="ic"><use href="#ic-terminal"/></svg><span class="nm">zsh（父）</span><span class="var">PATH=...</span></div>
<div class="link" id="link"><span class="flow">PATH</span></div>
<div class="children">
<div class="child" data-i="0"><svg class="ic"><use href="#ic-block"/></svg><span class="nm">claude</span><span class="got">?</span></div>
<div class="child" data-i="1"><svg class="ic"><use href="#ic-chip"/></svg><span class="nm">node</span><span class="got">?</span></div>
<div class="child" data-i="2"><svg class="ic"><use href="#ic-block"/></svg><span class="nm">codex</span><span class="got">?</span></div>
</div>
</div>
</div>
<div class="dialogue" id="dlg" data-role="narrator"><div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div><span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span><div class="continue" id="cont">Action ▸</div></div>
<button class="replay-btn" onclick="event.stopPropagation();reset();advance();">NG · 再拍一条</button>
</div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')],parent=document.getElementById('parent'),link=document.getElementById('link'),children=[...document.querySelectorAll('.child')];
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),tt=document.getElementById('tt'),cont=document.getElementById('cont');
let step=0,typing=false,typeTimer=null,pending=null,lock=false,curText='';const TOTAL=6;
function setDots(n){dots.forEach((d,j)=>d.classList.toggle('on',j<n));}
function setSpeaker(r,l,i){dlg.dataset.role=r;spk.innerHTML='<svg class="spk-ic"><use href="#'+i+'"/></svg><span class="spk-nm">'+l+'</span>';}
function typeSpeak(r,l,i,t){curText=t;return new Promise(res=>{pending=res;typing=true;setSpeaker(r,l,i);tt.textContent='';cont.classList.remove('show');let k=0;typeTimer=setInterval(()=>{tt.textContent=t.slice(0,++k);if(k>=t.length){clearInterval(typeTimer);typing=false;cont.classList.add('show');pending=null;res();}},42);});}
function fast(){if(!typing)return false;clearInterval(typeTimer);tt.textContent=curText;typing=false;cont.classList.add('show');if(pending){const r=pending;pending=null;r();}return true;}
async function goStep(n){setDots(n);
if(n===1){await typeSpeak('narrator','场务','ic-bubble','这场讲 export——为什么不能直接写 PATH=... 而要加 export。');}
else if(n===2){parent.classList.add('show','lit');await wait(500);await typeSpeak('narrator','场务','ic-bubble','父 shell 里设了变量 PATH。');}
else if(n===3){children.forEach((c,i)=>setTimeout(()=>c.classList.add('show'),i*120));await wait(600);await typeSpeak('narrator','场务','ic-bubble','你运行 claude、node、codex——它们都是子进程。');}
else if(n===4){parent.classList.add('hold');parent.classList.remove('lit');link.classList.add('broken');children.forEach(c=>{c.classList.add('blind');c.querySelector('.got').textContent='看不到';});await wait(500);await typeSpeak('narrator','场务','ic-bubble','没 export：变量只在父 shell 内部，子进程根本看不到。');}
else if(n===5){parent.classList.remove('hold');parent.classList.add('lit');link.classList.remove('broken');link.classList.add('flowing');children.forEach(c=>{c.classList.remove('blind');c.classList.add('fed');c.querySelector('.got').textContent='✓ 拿到';});await wait(600);await typeSpeak('zsh','zsh','ic-terminal','加了 export：变量拷贝一份给子进程——它们才找得到。');}
else if(n===6){await typeSpeak('narrator','场务','ic-bubble','所以 PATH 必须带 export，不然 node 根本看不到。下一场，看看为什么每进程的环境是独立的。');cont.textContent='Action · 下一场 ▸';cont.classList.add('show');}
}
function reset(){step=0;lock=false;parent.classList.remove('show','lit','hold');link.classList.remove('broken','flowing');children.forEach(c=>{c.classList.remove('show','blind','fed');c.querySelector('.got').textContent='?';});setDots(0);setSpeaker('narrator','场务','ic-bubble');tt.textContent='喊 Action 开拍';cont.classList.remove('show');cont.textContent='Action ▸';}
async function advance(){if(lock)return;if(fast())return;if(step>=TOTAL)reset();step++;lock=true;await goStep(step);lock=false;}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){e.preventDefault();advance();}});
</script>
</body>
</html>
