<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族史 · 剧组版</title>
<style>
  :root{
    --bg:#fafafa; --surface:#fff; --hair:#e2e2e2;
    --text:#1a1a1a; --muted:#9a9a9a;
    --accent:#002FA7; --accent-bg:#E6EBF5; --accent-soft:#EEF2FB;
    --warn:#D4392B;
    --r-zsh:#002FA7; --r-nar:#6a6a6a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;
  }
  .slide{
    width:min(980px,95vw); height:min(660px,93vh);
    display:flex; flex-direction:column; gap:0; padding:38px 46px; position:relative;
  }
  header.sl-h{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--hair); padding-bottom:16px; margin-bottom:18px;
  }
  header.sl-h h1{font-size:24px; font-weight:500; letter-spacing:.2px}
  header.sl-h .crumb{font-size:12px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase}
  header.sl-h .crumb b{color:var(--accent); font-weight:500}

  .stage{flex:1; display:flex; align-items:center; justify-content:center}
  .timeline{width:100%; display:flex; flex-direction:column; gap:54px}
  .lane{position:relative; padding:40px 0 48px}
  .lane-label{
    position:absolute; left:0; top:40px;
    font-size:12px; font-weight:500; letter-spacing:.3px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .lane-label .tag{padding:2px 8px; border:1px solid var(--hair); font-size:10px; letter-spacing:.4px}
  .lane-unix .lane-label{color:var(--accent)}
  .lane-unix .lane-label .tag{border-color:var(--accent); color:var(--accent)}
  .track{margin:0 0 0 110px; height:2px; background:var(--hair); position:relative}
  .node{
    position:absolute; top:-7px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center;
    transition:opacity .4s;
    opacity:0;
  }
  .node.show{opacity:1}
  .node .dot{width:14px; height:14px; border-radius:50%; background:var(--surface); border:2px solid var(--hair); transition:all .3s}
  .node .year{position:absolute; top:-30px; font-size:11px; color:var(--muted); white-space:nowrap; font-family:"SF Mono",Menlo,monospace; transition:color .3s}
  .node .name{position:absolute; top:22px; font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap; transition:color .3s}
  .node .sub{position:absolute; top:42px; font-size:10px; color:var(--muted); white-space:nowrap; transition:color .3s}
  .node.lit .dot{background:var(--accent); border-color:var(--accent); transform:scale(1.15)}
  .node.lit .year, .node.lit .name{color:var(--accent)}
  .node.hero.lit .dot{width:18px; height:18px; top:-9px; background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-bg)}
  .node.turn.lit .dot{background:var(--warn); border-color:var(--warn)}
  .node.turn.lit .year, .node.turn.lit .name{color:var(--warn)}

  .dialogue{
    border-left:3px solid var(--r-nar); padding:14px 0 14px 18px;
    min-height:84px; margin-top:14px; transition:border-color .3s;
  }
  .dialogue[data-role="zsh"]{border-color:var(--r-zsh)}
  .dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .speaker{font-size:13px; letter-spacing:.3px; display:flex; align-items:center; gap:7px; margin-bottom:8px; font-weight:500; color:var(--r-nar)}
  .dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
  .speaker .spk-ic{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px; border:1px solid currentColor; font-size:11px; letter-spacing:.4px}
  .type-text{font-size:18px; line-height:1.7; min-height:30px}
  .type-cursor{display:inline-block; width:9px; height:20px; background:var(--r-nar); vertical-align:-4px; margin-left:2px; animation:blink .7s step-end infinite}
  .dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px; color:var(--accent); letter-spacing:.5px; margin-top:10px; opacity:0; transition:.3s}
  .continue.show{opacity:1; animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4} 50%{opacity:1}}
  .progress{position:absolute; top:14px; right:20px; display:flex; gap:4px}
  .progress .dot{width:18px; height:3px; background:var(--hair); transition:.3s}
  .progress .dot.on{background:var(--accent)}
  .replay-btn{position:absolute; bottom:14px; right:20px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:7px 16px; font-size:12px; cursor:pointer; border-radius:0; letter-spacing:.5px; text-transform:uppercase; font-family:inherit; z-index:5}
  .replay-btn:hover{background:var(--accent); color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="03-Windows对照-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="05-为何用zsh-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.7"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="slide">
  <header class="sl-h">
    <h1>Shell 家族史：两条演化线</h1>
    <div class="crumb">场 04 · <b>家族史</b></div>
  </header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="stage">
    <div class="timeline">
      <div class="lane lane-unix">
        <div class="lane-label">Unix 脉 <span class="tag">文本流</span></div>
        <div class="track">
          <div class="node" data-i="0" style="left:15%"><span class="year">1979</span><span class="dot"></span><span class="name">sh</span><span class="sub">Bourne</span></div>
          <div class="node" data-i="1" style="left:38%"><span class="year">1989</span><span class="dot"></span><span class="name">bash</span><span class="sub">Linux 默认</span></div>
          <div class="node hero" data-i="2" style="left:61%"><span class="year">1990</span><span class="dot"></span><span class="name">zsh</span><span class="sub">主角登场</span></div>
          <div class="node turn" data-i="3" style="left:88%"><span class="year">2019</span><span class="dot"></span><span class="name">macOS 默认 zsh</span><span class="sub">换默认</span></div>
        </div>
      </div>
      <div class="lane lane-win">
        <div class="lane-label">Windows 脉 <span class="tag">对象流</span></div>
        <div class="track">
          <div class="node" data-i="4" style="left:20%"><span class="year">1981</span><span class="dot"></span><span class="name">COMMAND.COM</span><span class="sub">DOS</span></div>
          <div class="node" data-i="5" style="left:50%"><span class="year">1987</span><span class="dot"></span><span class="name">CMD</span><span class="sub"></span></div>
          <div class="node" data-i="6" style="left:80%"><span class="year">2006</span><span class="dot"></span><span class="name">PowerShell</span><span class="sub">.NET 对象</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="dialogue" id="dlg" data-role="narrator">
    <div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div>
    <span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span>
    <div class="continue" id="cont">Action ▸</div>
  </div>
  <button class="replay-btn" onclick="event.stopPropagation(); reset(); advance();">NG · 再拍一条</button>
</div>

<script>
const wait = ms => new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')];
const allNodes=[...document.querySelectorAll('.node')];
const dlg=document.getElementById('dlg'), spk=document.getElementById('spk'), tt=document.getElementById('tt'), cont=document.getElementById('cont');

let step=0, typing=false, typeTimer=null, pending=null, lock=false, curText='';
const TOTAL=6;

function setDots(n){ dots.forEach((d,j)=>d.classList.toggle('on', j<n)); }
function setSpeaker(role,label,icon){ dlg.dataset.role=role; spk.innerHTML='<svg class="spk-ic"><use href="#'+icon+'"/></svg><span class="spk-nm">'+label+'</span>'; }
function showNode(i){ const n=allNodes.find(x=>x.dataset.i==i); if(n) n.classList.add('show','lit'); }

function typeSpeak(role,label,icon,text){
  curText=text;
  return new Promise(res=>{
    pending=res; typing=true; setSpeaker(role,label,icon);
    tt.textContent=''; cont.classList.remove('show');
    let i=0;
    typeTimer=setInterval(()=>{
      tt.textContent=text.slice(0,++i);
      if(i>=text.length){ clearInterval(typeTimer); typing=false; cont.classList.add('show'); pending=null; res(); }
    },42);
  });
}
function fastFinish(){
  if(!typing) return false;
  clearInterval(typeTimer); tt.textContent=curText; typing=false; cont.classList.add('show');
  if(pending){ const r=pending; pending=null; r(); } return true;
}

async function goStep(n){
  setDots(n);
  if(n===1){
    await typeSpeak('narrator','场务','ic-bubble','Shell 不是一开始就长这样——两条线，各自演化了几十年。');
  } else if(n===2){
    showNode(0);
    await wait(500);
    await typeSpeak('narrator','场务','ic-bubble','Unix 这边，1979 年 Bourne shell 出生，叫 sh——所有 Unix shell 的祖宗。');
  } else if(n===3){
    showNode(1);
    await wait(500);
    await typeSpeak('narrator','场务','ic-bubble','1989 年，bash 出现，功能更多，成了大多数 Linux 的默认。');
  } else if(n===4){
    showNode(2);
    await wait(550);
    await typeSpeak('zsh','zsh','ic-terminal','1990 年轮到我——我比 bash 功能更丰富，还兼容它的语法。');
  } else if(n===5){
    showNode(3);
    await wait(500);
    await typeSpeak('narrator','场务','ic-bubble','2019 年，macOS 把默认从 bash 换成了 zsh。为什么换？下一场讲。');
  } else if(n===6){
    showNode(4); await wait(280); showNode(5); await wait(280); showNode(6);
    await wait(500);
    await typeSpeak('narrator','场务','ic-bubble','Windows 那边是另一条线：COMMAND.COM → CMD → 2006 年 PowerShell。它传 .NET 对象，和我们 Unix 的文本流是两个路子。');
    cont.textContent='Action · 下一场 ▸'; cont.classList.add('show');
  }
}

function reset(){
  step=0; lock=false;
  allNodes.forEach(n=>n.classList.remove('show','lit'));
  setDots(0); setSpeaker('narrator','场务','ic-bubble'); tt.textContent='喊 Action 开拍'; cont.classList.remove('show'); cont.textContent='Action ▸';
}
async function advance(){
  if(lock) return;
  if(fastFinish()) return;
  if(step>=TOTAL){ reset(); }
  step++; lock=true;
  await goStep(step);
  lock=false;
}
document.addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ e.preventDefault(); advance(); }
});
</script>
</body>
