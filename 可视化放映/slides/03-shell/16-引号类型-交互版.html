<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引号类型 · 剧组版</title>
<style>
  :root{--bg:#fafafa;--surface:#fff;--hair:#e2e2e2;--text:#1a1a1a;--muted:#9a9a9a;--accent:#002FA7;--accent-soft:#EEF2FB;--warn:#D4392B;--warn-bg:#FBEDEB;--r-zsh:#002FA7;--r-nar:#6a6a6a}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .slide{width:min(980px,95vw);height:min(660px,93vh);display:flex;flex-direction:column;gap:0;padding:38px 46px;position:relative}
  header.sl-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:14px}
  header.sl-h h1{font-size:24px;font-weight:500}.crumb{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}.crumb b{color:var(--accent);font-weight:500}
  .stage{flex:1;display:flex;align-items:center;justify-content:center}
  .cols{display:flex;gap:18px;width:100%}
  .col{flex:1;border:1px solid var(--hair);background:var(--surface);padding:26px 22px;display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(10px);transition:.4s}
  .col.show{opacity:1;transform:none}
  .col .sym{font-family:"SF Mono",Menlo,monospace;font-size:28px;font-weight:500;color:var(--muted);transition:color .3s}
  .col .nm{font-size:15px;font-weight:500;transition:color .3s}
  .col .code{font-family:"SF Mono",Menlo,monospace;font-size:13px;background:#f6f6f6;padding:10px 12px;border-left:2px solid var(--hair);line-height:1.7;color:var(--muted);transition:.3s}
  .col .arrow{font-size:12px;color:var(--muted);text-align:center}
  .col .result{font-family:"SF Mono",Menlo,monospace;font-size:13px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);text-align:center;opacity:0;transition:.4s}
  .col .result.show{opacity:1}
  .col .desc{font-size:12px;color:var(--muted);margin-top:auto;line-height:1.6}
  .col.lit{border-color:var(--accent)}
  .col.lit .sym,.col.lit .nm{color:var(--accent)}
  .col.lit .code{border-left-color:var(--accent);color:var(--text)}
  .dialogue{border-left:3px solid var(--r-nar);padding:14px 0 14px 18px;min-height:84px;margin-top:14px;transition:border-color .3s}
  .dialogue[data-role="zsh"]{border-color:var(--r-zsh)}.dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .speaker{font-size:13px;letter-spacing:.3px;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:500;color:var(--r-nar)}
  .dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
  .speaker .spk-ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px;border:1px solid currentColor;font-size:11px;letter-spacing:.4px}
  .type-text{font-size:18px;line-height:1.7;min-height:30px}
  .type-cursor{display:inline-block;width:9px;height:20px;background:var(--r-nar);vertical-align:-4px;margin-left:2px;animation:blink .7s step-end infinite}
  .dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px;color:var(--accent);letter-spacing:.5px;margin-top:10px;opacity:0;transition:.3s}
  .continue.show{opacity:1;animation:pulse 1.4s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .progress{position:absolute;top:14px;right:20px;display:flex;gap:4px}.progress .dot{width:18px;height:3px;background:var(--hair);transition:.3s}.progress .dot.on{background:var(--accent)}
  .replay-btn{position:absolute;bottom:14px;right:20px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 16px;font-size:12px;cursor:pointer;border-radius:0;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;z-index:5}.replay-btn:hover{background:var(--accent);color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="15-alias钓鱼-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="17-损坏复盘-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.7"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="slide">
  <header class="sl-h"><h1>引号：一个没闭合，整文件废</h1><div class="crumb">场 16 · <b>引号</b></div></header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="stage">
    <div class="cols">
      <div class="col" data-i="0"><div class="sym">" "</div><div class="nm">双引号</div><div class="code">echo "$HOME"</div><div class="arrow">→</div><div class="result">/Users/ioao</div><div class="desc">变量会展开</div></div>
      <div class="col" data-i="1"><div class="sym">' '</div><div class="nm">单引号</div><div class="code">echo '$HOME'</div><div class="arrow">→</div><div class="result">$HOME</div><div class="desc">原样，不展开</div></div>
      <div class="col" data-i="2"><div class="sym">$( )</div><div class="nm">命令替换</div><div class="code">echo $(whoami)</div><div class="arrow">→</div><div class="result">ioao</div><div class="desc">先执行，再替换</div></div>
    </div>
  </div>
  <div class="dialogue" id="dlg" data-role="narrator"><div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div><span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span><div class="continue" id="cont">Action ▸</div></div>
  <button class="replay-btn" onclick="event.stopPropagation();reset();advance();">NG · 再拍一条</button>
</div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')],cols=[...document.querySelectorAll('.col')];
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),tt=document.getElementById('tt'),cont=document.getElementById('cont');
let step=0,typing=false,typeTimer=null,pending=null,lock=false,curText='';const TOTAL=6;
function setDots(n){dots.forEach((d,j)=>d.classList.toggle('on',j<n));}
function setSpeaker(r,l,i){dlg.dataset.role=r;spk.innerHTML='<svg class="spk-ic"><use href="#'+i+'"/></svg><span class="spk-nm">'+l+'</span>';}
function typeSpeak(r,l,i,t){curText=t;return new Promise(res=>{pending=res;typing=true;setSpeaker(r,l,i);tt.textContent='';cont.classList.remove('show');let k=0;typeTimer=setInterval(()=>{tt.textContent=t.slice(0,++k);if(k>=t.length){clearInterval(typeTimer);typing=false;cont.classList.add('show');pending=null;res();}},42);});}
function fast(){if(!typing)return false;clearInterval(typeTimer);tt.textContent=curText;typing=false;cont.classList.add('show');if(pending){const r=pending;pending=null;r();}return true;}
async function goStep(n){setDots(n);
  if(n===1){await typeSpeak('narrator','场务','ic-bubble','这场讲引号——一个没闭合，整个 .zshrc 就废。');}
  else if(n===2){cols[0].classList.add('show','lit');cols[0].querySelector('.result').classList.add('show');await wait(550);await typeSpeak('narrator','场务','ic-bubble','双引号：变量会展开。\"$HOME\" 变成 /Users/ioao。');}
  else if(n===3){cols[1].classList.add('show','lit');cols[1].querySelector('.result').classList.add('show');await wait(550);await typeSpeak('narrator','场务','ic-bubble','单引号：原样不展开。\'$HOME\' 还是 $HOME。');}
  else if(n===4){cols[2].classList.add('show','lit');cols[2].querySelector('.result').classList.add('show');await wait(550);await typeSpeak('narrator','场务','ic-bubble','命令替换 $()：先执行里面，再用结果替换。$(whoami) 变成 ioao。');}
  else if(n===5){await typeSpeak('zsh','zsh','ic-terminal','一个引号没闭合，后面整段被当字符串——语法错，我直接停。');}
  else if(n===6){await typeSpeak('narrator','场务','ic-bubble','下一场，复盘你那次 .zshrc 损坏，教你怎么自检。');cont.textContent='Action · 下一场 ▸';cont.classList.add('show');}
}
function reset(){step=0;lock=false;cols.forEach(c=>{c.classList.remove('show','lit');c.querySelector('.result').classList.remove('show');});setDots(0);setSpeaker('narrator','场务','ic-bubble');tt.textContent='喊 Action 开拍';cont.classList.remove('show');cont.textContent='Action ▸';}
async function advance(){if(lock)return;if(fast())return;if(step>=TOTAL)reset();step++;lock=true;await goStep(step);lock=false;}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){e.preventDefault();advance();}});
</script>
</body>
</html>
