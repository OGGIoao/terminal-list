<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面 · 剧组版</title>
<style>
  :root{--bg:#fafafa;--surface:#fff;--hair:#e2e2e2;--text:#1a1a1a;--muted:#9a9a9a;--accent:#002FA7;--accent-bg:#E6EBF5;--r-zsh:#002FA7;--r-nar:#6a6a6a;--r-claude:#534AB7;--r-att:#A32D2D}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .slide{width:min(980px,95vw);height:min(660px,93vh);display:flex;flex-direction:column;gap:0;padding:38px 46px;position:relative}
  header.sl-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:14px}
  header.sl-h h1{font-size:24px;font-weight:500}.crumb{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}.crumb b{color:var(--accent);font-weight:500}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
  .head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .kicker{font-size:13px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;opacity:0;transition:.5s}
  .kicker.show{opacity:1}
  .title{font-size:40px;font-weight:500;letter-spacing:.5px;opacity:0;transform:translateY(12px);transition:.6s .15s}
  .title.show{opacity:1;transform:none}
  .rule{width:0;height:2px;background:var(--accent);transition:width .7s .35s}
  .rule.show{width:100px}
  .cast{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:720px}
  .actor{border:1px solid var(--hair);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;width:120px;opacity:0;transform:translateY(10px) scale(.9);transition:.4s}
  .actor.show{opacity:1;transform:none}
  .actor .ic{width:32px;height:32px;stroke:var(--muted);fill:none;stroke-width:1.6;transition:stroke .3s}
  .actor .nm{font-size:13px;font-weight:500;transition:color .3s}
  .actor .role{font-size:10px;color:var(--muted);text-align:center;line-height:1.4}
  .actor.zsh{border-color:var(--r-zsh)}.actor.zsh.show .ic,.actor.zsh.show .nm{stroke:var(--r-zsh);color:var(--r-zsh)}
  .actor.claude{border-color:var(--r-claude)}.actor.claude.show .ic,.actor.claude.show .nm{stroke:var(--r-claude);color:var(--r-claude)}
  .actor.att{border-color:var(--r-att)}.actor.att.show .ic,.actor.att.show .nm{stroke:var(--r-att);color:var(--r-att)}
  .dialogue{border-left:3px solid var(--r-nar);padding:14px 0 14px 18px;min-height:84px;margin-top:14px;transition:border-color .3s}
  .dialogue[data-role="zsh"]{border-color:var(--r-zsh)}.dialogue[data-role="narrator"]{border-color:var(--r-nar)}
  .speaker{font-size:13px;letter-spacing:.3px;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:500;color:var(--r-nar)}
  .dialogue[data-role="zsh"] .speaker{color:var(--r-zsh)}
  .speaker .spk-ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .speaker .spk-nm{padding:2px 9px;border:1px solid currentColor;font-size:11px;letter-spacing:.4px}
  .type-text{font-size:18px;line-height:1.7;min-height:30px}
  .type-cursor{display:inline-block;width:9px;height:20px;background:var(--r-nar);vertical-align:-4px;margin-left:2px;animation:blink .7s step-end infinite}
  .dialogue[data-role="zsh"] .type-cursor{background:var(--r-zsh)}
  @keyframes blink{50%{opacity:0}}
  .continue{font-size:12px;color:var(--accent);letter-spacing:.5px;margin-top:10px;opacity:0;transition:.3s}
  .continue.show{opacity:1;animation:pulse 1.4s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .progress{position:absolute;top:14px;right:20px;display:flex;gap:4px}.progress .dot{width:18px;height:3px;background:var(--hair);transition:.3s}.progress .dot.on{background:var(--accent)}
  .replay-btn{position:absolute;bottom:14px;right:20px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 16px;font-size:12px;cursor:pointer;border-radius:0;letter-spacing:.5px;text-transform:uppercase;font-family:inherit;z-index:5}.replay-btn:hover{background:var(--accent);color:#fff}
</style>
</head>
<body><!--nav--><div style="position:fixed;top:0;left:0;right:0;height:36px;background:#fff;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9999;font-family:-apple-system,sans-serif;box-sizing:border-box"><a href="" onclick="event.stopPropagation()" style="font-size:13px;color:#ccc;text-decoration:none;pointer-events:none">‹ 上一页</a><a href="../../第三卷目录.html" onclick="event.stopPropagation()" style="font-size:13px;color:#9a9a9a;text-decoration:none">目录</a><a href="02-三层概念-交互版.html" onclick="event.stopPropagation()" style="font-size:13px;color:#002FA7;text-decoration:none;pointer-events:auto">下一页 ›</a></div><style>body{padding-top:36px !important}</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" fill="none" stroke-width="1.6"/><path d="M6 9 l3 3 -3 3" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="15" x2="17" y2="15" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="ic-bubble" viewBox="0 0 24 24"><path d="M3 5 h18 v11 h-9 l-4 4 v-4 h-5 z" fill="none" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="ic-file" viewBox="0 0 24 24"><path d="M6 3 h8 l4 4 v14 h-12 z M14 3 v4 h4" fill="none" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7 h6 l2 2 h10 v10 h-18 z" fill="none" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="ic-block" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke-width="1.6"/><rect x="9" y="9" width="6" height="6" fill="none" stroke-width="1.6"/></symbol>
<symbol id="ic-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1" fill="none" stroke-width="1.6"/><path d="M8 11 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke-width="1.6"/></symbol>
</defs></svg>
<div class="slide">
  <header class="sl-h"><h1>第三卷 · Shell 与终端</h1><div class="crumb">场 01 · <b>开机</b></div></header>
  <div class="progress" id="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="stage">
    <div class="head">
      <div class="kicker" id="kk">卷三</div>
      <div class="title" id="tt2">Shell 与终端</div>
      <div class="rule" id="rl"></div>
    </div>
    <div class="cast" id="cast">
      <div class="actor zsh" data-i="0"><svg class="ic"><use href="#ic-terminal"/></svg><div class="nm">zsh</div><div class="role">主演 · 你的 Shell</div></div>
      <div class="actor" data-i="1"><svg class="ic"><use href="#ic-file"/></svg><div class="nm">.zshrc</div><div class="role">契约文件</div></div>
      <div class="actor" data-i="2"><svg class="ic"><use href="#ic-folder"/></svg><div class="nm">PATH</div><div class="role">寻路地图</div></div>
      <div class="actor claude" data-i="3"><svg class="ic"><use href="#ic-block"/></svg><div class="nm">claude</div><div class="role">找家的程序</div></div>
      <div class="actor att" data-i="4"><svg class="ic"><use href="#ic-lock"/></svg><div class="nm">攻击者</div><div class="role">反派</div></div>
    </div>
  </div>
  <div class="dialogue" id="dlg" data-role="narrator"><div class="speaker" id="spk"><svg class="spk-ic"><use href="#ic-bubble"/></svg><span class="spk-nm">场务</span></div><span class="type-text" id="tt">喊 Action 开拍</span><span class="type-cursor" id="tc"></span><div class="continue" id="cont">Action ▸</div></div>
  <button class="replay-btn" onclick="event.stopPropagation();reset();advance();">NG · 再拍一条</button>
</div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dots=[...document.querySelectorAll('#progress .dot')],actors=[...document.querySelectorAll('.actor')];
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),tt=document.getElementById('tt'),cont=document.getElementById('cont');
let step=0,typing=false,typeTimer=null,pending=null,lock=false,curText='';const TOTAL=6;
function setDots(n){dots.forEach((d,j)=>d.classList.toggle('on',j<n));}
function setSpeaker(r,l,i){dlg.dataset.role=r;spk.innerHTML='<svg class="spk-ic"><use href="#'+i+'"/></svg><span class="spk-nm">'+l+'</span>';}
function typeSpeak(r,l,i,t){curText=t;return new Promise(res=>{pending=res;typing=true;setSpeaker(r,l,i);tt.textContent='';cont.classList.remove('show');let k=0;typeTimer=setInterval(()=>{tt.textContent=t.slice(0,++k);if(k>=t.length){clearInterval(typeTimer);typing=false;cont.classList.add('show');pending=null;res();}},42);});}
function fast(){if(!typing)return false;clearInterval(typeTimer);tt.textContent=curText;typing=false;cont.classList.add('show');if(pending){const r=pending;pending=null;r();}return true;}
async function goStep(n){setDots(n);
  if(n===1){['kk','tt2','rl'].forEach(id=>document.getElementById(id).classList.add('show'));await wait(700);await typeSpeak('narrator','场务','ic-bubble','第三卷 Shell 与终端，开机。先介绍演员——');}
  else if(n===2){actors[0].classList.add('show');await wait(450);await typeSpeak('zsh','zsh','ic-terminal','主演 zsh——你的 Shell，每页都在。');}
  else if(n===3){actors[1].classList.add('show');actors[2].classList.add('show');await wait(500);await typeSpeak('narrator','场务','ic-bubble','.zshrc 是契约文件，PATH 是寻路地图——贯穿全卷。');}
  else if(n===4){actors[3].classList.add('show');await wait(450);await typeSpeak('narrator','场务','ic-bubble','claude——找家的程序，第七场找不到家。');}
  else if(n===5){actors[4].classList.add('show');await wait(450);await typeSpeak('narrator','场务','ic-bubble','攻击者——反派，第八场登场。');}
  else if(n===6){await typeSpeak('narrator','场务','ic-bubble','演员到齐。导演，喊 Action 开拍吧。');cont.textContent='Action · 第一场 ▸';cont.classList.add('show');}
}
function reset(){step=0;lock=false;['kk','tt2','rl'].forEach(id=>document.getElementById(id).classList.remove('show'));actors.forEach(a=>a.classList.remove('show'));setDots(0);setSpeaker('narrator','场务','ic-bubble');tt.textContent='喊 Action 开拍';cont.classList.remove('show');cont.textContent='Action ▸';}
async function advance(){if(lock)return;if(fast())return;if(step>=TOTAL)reset();step++;lock=true;await goStep(step);lock=false;}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){e.preventDefault();advance();}});
</script>
</body>
</html>
