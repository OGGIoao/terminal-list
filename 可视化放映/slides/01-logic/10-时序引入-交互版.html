<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场10·时序引入</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0a;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--muted:#8a8a8e;--amber:#EF9F27;--clk:#7F77DD;--red:#A32D2D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:22px 40px 8px;overflow:hidden}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .title{font-size:23px;font-weight:500;letter-spacing:-.5px;margin-bottom:2px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
  .canvas{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden;padding-bottom:8px}
  .canvas svg{width:100%;max-width:560px;height:auto}
  .wire{stroke:var(--hair);stroke-width:1.5;fill:none;transition:stroke .3s,stroke-width .3s}
  .wire.on{stroke:var(--accent);stroke-width:2.2}
  .wire.clk{stroke:var(--clk);stroke-width:1.8}
  .blk{fill:#fff;stroke:var(--hair);stroke-width:1.2;transition:all .3s}
  .blk.on{stroke:var(--accent);stroke-width:1.8;fill:rgba(0,47,167,.04)}
  .glbl{font:600 12px ui-sans-serif,system-ui;fill:var(--ink);text-anchor:middle}
  .panetag{font:500 10px ui-monospace,monospace;fill:var(--muted);text-anchor:middle;letter-spacing:1px;text-transform:uppercase}
  .lbl{font:500 11px ui-monospace,monospace;fill:var(--muted)}
  .lbl.key{fill:var(--ink)}
  .val{font:600 14px ui-monospace,monospace;fill:var(--muted);text-anchor:middle}
  .val.on{fill:var(--accent)}
  .val.keep{fill:var(--amber)}
  .nd{fill:var(--ink)}
  .photon{fill:var(--accent);opacity:0}
  .photon.run{animation:fl 1.1s linear infinite}
  @keyframes fl{0%{opacity:0;transform:translateX(0)}25%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(var(--d,80px))}}
  .sep{stroke:var(--hair);stroke-width:1;stroke-dasharray:3,4}
  .dock{border-top:1px solid var(--hair);padding:18px 40px;height:156px;position:relative;display:flex;flex-direction:column;justify-content:center}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.clk{color:var(--clk)}
  .dialogue{font-size:16px;line-height:1.5;min-height:52px;max-width:840px}
  .dialogue .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:40px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:40px;bottom:16px;display:flex;gap:16px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 10 · <b>时序引入</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 电路要会记忆了</div>
  <div class="title">组合电路没记忆，时序电路有</div>
  <div class="sub">算账要存中间结果、按步骤来——电路得记住上一次的状态</div>
  <div class="canvas">
    <svg viewBox="0 0 560 210">
      <line class="sep" x1="280" y1="20" x2="280" y2="195"/>
      <!-- 左:组合电路 -->
      <text class="panetag" x="140" y="25">组合电路 · 即时反应</text>
      <circle class="nd" cx="40" cy="80" r="3"/><text class="lbl key" x="32" y="84" text-anchor="end">A</text>
      <text class="val" id="LA" x="32" y="70" text-anchor="end">0</text>
      <line class="wire" id="LwA" x1="40" y1="80" x2="120" y2="80"/>
      <circle class="photon" id="Lp" cx="45" cy="80" r="3" style="--d:75px"/>
      <rect class="blk" id="Lg" x="120" y="60" width="70" height="40" rx="2"/>
      <text class="glbl" x="155" y="84">逻辑门</text>
      <line class="wire" id="LwY" x1="190" y1="80" x2="250" y2="80"/>
      <text class="lbl key" x="255" y="75">Y</text>
      <text class="val" id="LY" x="255" y="92">0</text>
      <text class="lbl" x="140" y="140" text-anchor="middle">输入一变</text>
      <text class="lbl" x="140" y="155" text-anchor="middle">输出立刻变</text>
      <text class="lbl" x="140" y="180" text-anchor="middle" style="fill:var(--red,#A32D2D)">没有记忆</text>
      <!-- 右:时序电路 -->
      <text class="panetag" x="380" y="25">时序电路 · 能记忆</text>
      <circle class="nd" cx="310" cy="80" r="3"/><text class="lbl key" x="302" y="84" text-anchor="end">A</text>
      <text class="val" id="RA" x="302" y="70" text-anchor="end">0</text>
      <line class="wire" id="RwA" x1="310" y1="80" x2="390" y2="80"/>
      <circle class="photon" id="Rp" cx="315" cy="80" r="3" style="--d:75px"/>
      <rect class="blk" id="Rg" x="390" y="55" width="80" height="50" rx="2"/>
      <text class="glbl" x="430" y="80">存储</text>
      <line class="wire clk" id="Rclk" x1="430" y1="15" x2="430" y2="55"/>
      <path class="wire clk" d="M415 20 h10 v-8 h10 v8 h10" fill="none"/>
      <text class="lbl" x="455" y="20">时钟</text>
      <line class="wire" id="RwY" x1="470" y1="80" x2="530" y2="80"/>
      <text class="lbl key" x="535" y="75">Y</text>
      <text class="val" id="RY" x="535" y="92">0</text>
      <text class="lbl" x="420" y="140" text-anchor="middle">输入撤了</text>
      <text class="lbl" x="420" y="155" text-anchor="middle">输出保持上一次</text>
      <text class="lbl" x="420" y="180" text-anchor="middle" style="fill:var(--amber)">有记忆</text>
    </svg>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="09-解码器-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="11-锁存器-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
let step=0,typing=false,pending=null,curText='';
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  clk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 7 v5 l3 2"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function clearAll(){
  ['LwA','LwY','RwA','RwY'].forEach(id=>document.getElementById(id).classList.remove('on'));
  ['Lp','Rp'].forEach(id=>document.getElementById(id).classList.remove('run'));
  document.getElementById('Lg').classList.remove('on');document.getElementById('Rg').classList.remove('on');
  ['LA','RA','LY','RY'].forEach(id=>document.getElementById(id).className='val');
}
function setLeft(a){
  document.getElementById('LA').textContent=a;document.getElementById('LY').textContent=a;
  document.getElementById('LwA').classList.toggle('on',a);
  document.getElementById('LwY').classList.toggle('on',a);
  document.getElementById('Lg').classList.toggle('on',a);
  if(a){document.getElementById('Lp').classList.add('run');}else{document.getElementById('Lp').classList.remove('run');}
  document.getElementById('LA').className='val '+(a?'on':'');
  document.getElementById('LY').className='val '+(a?'on':'');
}
function setRight(a,keep){
  document.getElementById('RA').textContent=a;
  const out=keep!==undefined?keep:a;
  document.getElementById('RY').textContent=out;
  document.getElementById('RwA').classList.toggle('on',a);
  document.getElementById('RwY').classList.toggle('on',out);
  document.getElementById('Rg').classList.toggle('on',true);
  if(a){document.getElementById('Rp').classList.add('run');}else{document.getElementById('Rp').classList.remove('run');}
  document.getElementById('RA').className='val '+(a?'on':'');
  document.getElementById('RY').className='val '+(out?'keep':'');
}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){clearAll();setLeft(0);setRight(0);setSpeaker('staff','场务');await type('到这为止，所有电路都是即时反应——输入一变，输出立刻变，没有记忆。');}
  else if(n===2){setLeft(1);await wait(550);setSpeaker('staff','场务');await type('看左边组合电路：A=1，Y 立刻变 1。A 撤回 0，Y 也立刻变 0。它记不住上一次。');}
  else if(n===3){setLeft(0);setSpeaker('staff','场务');await type('但算账要存中间结果、按步骤来——算完一步得记住，下一步才能用。这就要记忆。');}
  else if(n===4){setRight(1,1);await wait(600);setSpeaker('staff','场务');await type('看右边时序电路：A=1 存进去，Y=1。关键是——');}
  else if(n===5){setRight(0,1);await wait(600);setSpeaker('staff','场务');await type('A 撤回 0 了，但 Y 还是 1！它记住了上一次。这就是记忆。');}
  else if(n===6){setSpeaker('clk','时钟');await type('该我出场了。没我打节拍，记忆也用不上——电路得知道什么时候存、什么时候读。');}
  else if(n===7){clearAll();setLeft(0);setRight(0);setSpeaker('staff','场务');await type('下一场，看记忆怎么实现——两个门互相锁定，就能存住 1 位。');cont.textContent='Action · 下一场 ▸';}
  if(n<7)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<7){step++;goStep(step);}else{window.location.href='11-锁存器-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';clearAll();setLeft(0);setRight(0);setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
