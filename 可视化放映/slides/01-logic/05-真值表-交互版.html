<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场05·真值表是电路的语言</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0b;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--amber:#EF9F27;--muted:#8a8a8e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:28px 56px 14px;overflow:hidden}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .title{font-size:24px;font-weight:500;letter-spacing:-.5px;margin-bottom:3px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:20px}
  .body{flex:1;display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:center;min-height:0}
  .sym-side{display:flex;flex-direction:column;align-items:center;gap:14px}
  .sym-side svg{width:100%;max-width:180px;height:auto}
  .sym-side svg path,.sym-side svg line,.sym-side svg circle{fill:none;stroke:var(--ink);stroke-width:1.6}
  .sym-name{font-size:14px;font-weight:500}
  .tt-side{display:flex;flex-direction:column;justify-content:center}
  .tt{border:1px solid var(--hair);border-collapse:collapse;font:500 16px ui-monospace,monospace}
  .tt th,.tt td{border:1px solid var(--hair);padding:14px 28px;text-align:center;width:90px}
  .tt th{background:rgba(0,47,167,.05);color:var(--ink);font-size:13px;letter-spacing:1px}
  .tt tr{opacity:.35;transition:opacity .4s}
  .tt tr.on{opacity:1}
  .tt .y{color:var(--accent);font-weight:600}
  .tt .n{color:var(--muted)}
  .tt td.out{font-size:18px}
  .tt-side .cap{font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:.5px}
  .dock{border-top:1px solid var(--hair);padding:14px 56px 16px;min-height:108px;position:relative}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.tr{color:var(--accent)}
  .dialogue{font-size:16px;line-height:1.5;min-height:46px;max-width:820px}
  .dialogue .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:56px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:56px;bottom:18px;display:flex;gap:18px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 05 · <b>真值表是电路的语言</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 电路的规格说明书</div>
  <div class="title">一个表格，完整描述一个电路</div>
  <div class="sub">穷举所有输入组合，列出对应输出——这就是电路的合同</div>
  <div class="body">
    <div class="sym-side">
      <svg viewBox="0 0 120 80"><path d="M5 15 q15 25 0 50 q25 0 45 -25 q-20 -25 -45 -25 z"/><path d="M0 15 q15 25 0 50" fill="none"/><line x1="0" y1="25" x2="12" y2="25"/><line x1="0" y1="55" x2="12" y2="55"/><line x1="50" y1="40" x2="75" y2="40"/></svg>
      <div class="sym-name">异或门 XOR</div>
    </div>
    <div class="tt-side">
      <table class="tt" id="tt">
        <tr><th>A</th><th>B</th><th>Y</th></tr>
        <tr id="r1"><td>0</td><td>0</td><td class="out n">0</td></tr>
        <tr id="r2"><td>0</td><td>1</td><td class="out y">1</td></tr>
        <tr id="r3"><td>1</td><td>0</td><td class="out y">1</td></tr>
        <tr id="r4"><td>1</td><td>1</td><td class="out n">0</td></tr>
      </table>
      <div class="cap">四种输入组合，输出全列出——电路行为一览无余</div>
    </div>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="04-NAND万能门-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="06-半加器-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
const rows=[1,2,3,4].map(i=>document.getElementById('r'+i));
let step=0,typing=false,pending=null,curText='';
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="12" x2="11" y2="12"/><line x1="11" y1="7" x2="11" y2="17"/><line x1="13" y1="8" x2="13" y2="11"/><line x1="13" y1="13" x2="13" y2="16"/><line x1="13" y1="9" x2="20" y2="9"/><line x1="13" y1="15" x2="20" y2="15"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function light(i){rows[i].classList.add('on');}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){setSpeaker('staff','场务');await type('这张表是电路的合同。左边是异或门，右边是它的真值表——所有输入组合都列出来。');}
  else if(n===2){light(0);light(1);await wait(600);setSpeaker('staff','场务');await type('A=0 B=0 输出 0；A=0 B=1 输出 1。输入不同，输出 1。');}
  else if(n===3){light(2);light(3);await wait(600);setSpeaker('staff','场务');await type('A=1 B=0 输出 1；A=1 B=1 输出 0。输入相同，输出 0。');}
  else if(n===4){setSpeaker('tr','XOR');await type('不同才 1，相同就 0——这就是异或。下一场你会看到，我正好用来做加法。');}
  else if(n===5){setSpeaker('staff','场务');await type('穷举所有输入，输出全列出——这就是电路的规格说明书。下一场，用门搭个真东西。');cont.textContent='Action · 下一场 ▸';}
  if(n<5)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<5){step++;goStep(step);}else{window.location.href='06-半加器-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';rows.forEach(r=>r.classList.remove('on'));setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
