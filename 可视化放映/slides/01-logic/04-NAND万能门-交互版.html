<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场04·NAND是万能门</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0b;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--amber:#EF9F27;--muted:#8a8a8e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:30px 48px 18px;overflow:hidden;position:relative}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .title{font-size:26px;font-weight:500;letter-spacing:-.5px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
  .canvas{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  .canvas svg{width:100%;max-width:680px;height:auto}
  .ln{stroke:var(--hair);stroke-width:1.5;fill:none;transition:stroke .4s,stroke-width .4s}
  .ln.grow{stroke:var(--accent);stroke-width:2;stroke-dasharray:300;stroke-dashoffset:300;animation:grow .7s ease forwards}
  @keyframes grow{to{stroke-dashoffset:0}}
  .node{fill:#fff;stroke:var(--hair);stroke-width:1;opacity:.4;transition:opacity .5s}
  .node.on{opacity:1;stroke:var(--accent)}
  .center{fill:var(--accent);stroke:var(--accent);opacity:0;transition:opacity .5s}
  .center.on{opacity:1}
  .nlbl{font:500 13px ui-sans-serif,system-ui;fill:var(--muted);text-anchor:middle;opacity:.4;transition:opacity .5s}
  .nlbl.on{opacity:1;fill:var(--ink)}
  .clbl{font:600 16px ui-sans-serif,system-ui;fill:#fff;text-anchor:middle;opacity:0;transition:opacity .5s}
  .clbl.on{opacity:1}
  .formula{font:500 10px ui-monospace,monospace;fill:var(--muted);text-anchor:middle;opacity:0;transition:opacity .5s}
  .formula.on{opacity:1}
  .dock{border-top:1px solid var(--hair);padding:18px 48px 20px;min-height:120px;position:relative}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.tr{color:var(--accent)}
  .dialogue{font-size:18px;line-height:1.55;min-height:56px;max-width:820px}
  .dialogue .cursor{display:inline-block;width:9px;height:20px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:48px;bottom:22px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:48px;bottom:22px;display:flex;gap:18px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 04 · <b>NAND 是万能门</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 万能基石</div>
  <div class="title">一个门，搭出所有门</div>
  <div class="sub">NAND 居中，辐射出它能搭出的每一种门</div>
  <div class="canvas">
    <svg viewBox="0 0 680 380">
      <!-- 连线(终点缩短,不进入目标方块) -->
      <line class="ln" id="l1" x1="340" y1="190" x2="170" y2="80"/>
      <line class="ln" id="l2" x1="340" y1="190" x2="510" y2="80"/>
      <line class="ln" id="l3" x1="340" y1="190" x2="170" y2="300"/>
      <line class="ln" id="l4" x1="340" y1="190" x2="510" y2="300"/>
      <!-- 中心NAND -->
      <rect class="center" id="ctr" x="290" y="160" width="100" height="60" rx="2"/>
      <text class="clbl" id="clbl" x="340" y="195" dominant-baseline="central">NAND</text>
      <!-- 四角目标门 -->
      <rect class="node" id="n1" x="100" y="55" width="140" height="50" rx="2"/>
      <text class="nlbl" id="t1" x="170" y="73" dominant-baseline="central">非门 NOT</text>
      <text class="formula" id="f1" x="170" y="92" dominant-baseline="central">NAND 两输入短接</text>
      <rect class="node" id="n2" x="440" y="55" width="140" height="50" rx="2"/>
      <text class="nlbl" id="t2" x="510" y="73" dominant-baseline="central">与门 AND</text>
      <text class="formula" id="f2" x="510" y="92" dominant-baseline="central">NAND + 非门</text>
      <rect class="node" id="n3" x="100" y="275" width="140" height="50" rx="2"/>
      <text class="nlbl" id="t3" x="170" y="293" dominant-baseline="central">或门 OR</text>
      <text class="formula" id="f3" x="170" y="312" dominant-baseline="central">NAND + 非门(德摩根)</text>
      <rect class="node" id="n4" x="440" y="275" width="140" height="50" rx="2"/>
      <text class="nlbl" id="t4" x="510" y="293" dominant-baseline="central">异或门 XOR</text>
      <text class="formula" id="f4" x="510" y="312" dominant-baseline="central">4 个 NAND</text>
    </svg>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="03b-逻辑门全家福-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="05-真值表-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
const ctr=document.getElementById('ctr'),clbl=document.getElementById('clbl');
const lns=[1,2,3,4].map(i=>document.getElementById('l'+i));
const nodes=[1,2,3,4].map(i=>document.getElementById('n'+i));
const tlbl=[1,2,3,4].map(i=>document.getElementById('t'+i));
const fml=[1,2,3,4].map(i=>document.getElementById('f'+i));
let step=0,typing=false,pending=null,curText='';
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="12" x2="11" y2="12"/><line x1="11" y1="7" x2="11" y2="17"/><line x1="13" y1="8" x2="13" y2="11"/><line x1="13" y1="13" x2="13" y2="16"/><line x1="13" y1="9" x2="20" y2="9"/><line x1="13" y1="15" x2="20" y2="15"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function lightCenter(){ctr.classList.add('on');clbl.classList.add('on');}
function growLine(i){lns[i].classList.add('grow');}
function lightNode(i){nodes[i].classList.add('on');tlbl[i].classList.add('on');fml[i].classList.add('on');}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){setSpeaker('staff','场务');await type('这场聚光灯打中间——NAND 站中间，看它怎么辐射出所有门。');}
  else if(n===2){lightCenter();await wait(550);setSpeaker('tr','NAND');await type('给我足够多的我，我能搭出整个世界。我的构成见上页全家福。');}
  else if(n===3){growLine(0);await wait(700);lightNode(0);await wait(300);setSpeaker('staff','场务');await type('把 NAND 两个输入短接，就成了非门。最简单的变身。');}
  else if(n===4){growLine(1);growLine(2);await wait(700);lightNode(1);lightNode(2);await wait(300);setSpeaker('staff','场务');await type('NAND 后面接个非门，就是与门；用德摩根律变一下，就是或门。');}
  else if(n===5){growLine(3);await wait(700);lightNode(3);await wait(300);setSpeaker('tr','NAND');await type('四个我拼起来，就是异或门——半加器的核心。');}
  else if(n===6){setSpeaker('staff','场务');await type('一个门搭出所有门。所以芯片里到处都是 NAND——它是最省事的万能积木。下一场，看怎么描述一个门的行为。');cont.textContent='Action · 下一场 ▸';}
  if(n<6)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<6){step++;goStep(step);}else{window.location.href='05-真值表-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';ctr.classList.remove('on');clbl.classList.remove('on');lns.forEach(l=>l.classList.remove('grow'));nodes.forEach(n=>n.classList.remove('on'));tlbl.forEach(t=>t.classList.remove('on'));fml.forEach(f=>f.classList.remove('on'));setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
