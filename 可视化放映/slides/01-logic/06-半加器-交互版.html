<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场06·半加器</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0b;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--amber:#EF9F27;--muted:#8a8a8e;--red:#A32D2D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:24px 48px 12px;overflow:hidden}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .title{font-size:24px;font-weight:500;letter-spacing:-.5px;margin-bottom:3px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .canvas{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  .canvas svg{width:100%;max-width:520px;height:auto}
  .wire{stroke:var(--hair);stroke-width:1.5;fill:none;transition:stroke .3s,stroke-width .3s}
  .wire.on{stroke:var(--accent);stroke-width:2.2}
  .gate{fill:#fff;stroke:var(--hair);stroke-width:1.2;transition:all .3s}
  .gate.on{stroke:var(--accent);stroke-width:1.8}
  .glbl{font:600 13px ui-sans-serif,system-ui;fill:var(--ink);text-anchor:middle}
  .lbl{font:500 11px ui-monospace,monospace;fill:var(--muted)}
  .lbl.key{fill:var(--ink)}
  .lbl.on{fill:var(--accent)}
  .val{font:600 16px ui-monospace,monospace;fill:var(--muted);text-anchor:middle}
  .val.on{fill:var(--accent)}
  .val.off{fill:var(--red)}
  .nd{fill:var(--ink)}
  .dock{border-top:1px solid var(--hair);padding:14px 48px 16px;min-height:108px;position:relative}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.tr{color:var(--accent)}
  .dialogue{font-size:16px;line-height:1.5;min-height:46px;max-width:820px}
  .dialogue .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:48px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:48px;bottom:18px;display:flex;gap:18px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 06 · <b>半加器</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 最简单的算术</div>
  <div class="title">半加器：两个门各管一件事</div>
  <div class="sub">XOR 管"和"，AND 管"进位"——合起来就会 1 位加法</div>
  <div class="canvas">
    <svg viewBox="0 0 520 190">
      <!-- 输入A,B -->
      <circle class="nd" cx="50" cy="50" r="3"/>
      <text class="lbl key" x="40" y="54" text-anchor="end">A</text>
      <text class="val" id="vA" x="40" y="40" text-anchor="end">0</text>
      <circle class="nd" cx="50" cy="140" r="3"/>
      <text class="lbl key" x="40" y="144" text-anchor="end">B</text>
      <text class="val" id="vB" x="40" y="130" text-anchor="end">0</text>
      <!-- A线分两路 -->
      <line class="wire" id="wA1" x1="50" y1="50" x2="150" y2="50"/>
      <line class="wire" id="wA2" x1="150" y1="50" x2="150" y2="55"/>
      <line class="wire" id="wA3" x1="150" y1="55" x2="230" y2="55"/>
      <line class="wire" id="wA4" x1="150" y1="50" x2="150" y2="125"/>
      <line class="wire" id="wA5" x1="150" y1="125" x2="230" y2="125"/>
      <!-- B线分两路 -->
      <line class="wire" id="wB1" x1="50" y1="140" x2="150" y2="140"/>
      <line class="wire" id="wB2" x1="150" y1="140" x2="150" y2="75"/>
      <line class="wire" id="wB3" x1="150" y1="75" x2="230" y2="75"/>
      <line class="wire" id="wB4" x1="150" y1="140" x2="150" y2="145"/>
      <line class="wire" id="wB5" x1="150" y1="145" x2="230" y2="145"/>
      <!-- XOR门 -->
      <rect class="gate" id="gX" x="230" y="45" width="80" height="40" rx="2"/>
      <text class="glbl" x="270" y="70">XOR</text>
      <!-- AND门 -->
      <rect class="gate" id="gA" x="230" y="125" width="80" height="40" rx="2"/>
      <text class="glbl" x="270" y="150">AND</text>
      <!-- XOR输出=和 -->
      <line class="wire" id="wS" x1="310" y1="65" x2="400" y2="65"/>
      <text class="lbl key" x="410" y="60">和 Sum</text>
      <text class="val" id="vS" x="460" y="69">0</text>
      <!-- AND输出=进位 -->
      <line class="wire" id="wC" x1="310" y1="145" x2="400" y2="145"/>
      <text class="lbl key" x="410" y="140">进位 Carry</text>
      <text class="val" id="vC" x="460" y="149">0</text>
      <!-- 结果 -->
      <text class="lbl" x="270" y="185" text-anchor="middle">结果 = 进位 + 和</text>
      <text class="val" id="vR" x="380" y="185" text-anchor="middle" style="font-size:14px">00</text>
    </svg>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="05-真值表-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="07-全加器-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
let step=0,typing=false,pending=null,curText='';
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="12" x2="11" y2="12"/><line x1="11" y1="7" x2="11" y2="17"/><line x1="13" y1="8" x2="13" y2="11"/><line x1="13" y1="13" x2="13" y2="16"/><line x1="13" y1="9" x2="20" y2="9"/><line x1="13" y1="15" x2="20" y2="15"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function setAdder(a,b){
  document.getElementById('vA').textContent=a;document.getElementById('vB').textContent=b;
  const sum=a^b,car=a&b;
  document.getElementById('vS').textContent=sum;document.getElementById('vC').textContent=car;
  document.getElementById('vR').textContent=''+car+sum;
  const aOn=a===1,bOn=b===1,sOn=sum===1,cOn=car===1;
  ['wA1','wA2','wA3','wA4','wA5'].forEach(id=>document.getElementById(id).classList.toggle('on',aOn));
  ['wB1','wB2','wB3','wB4','wB5'].forEach(id=>document.getElementById(id).classList.toggle('on',bOn));
  document.getElementById('wS').classList.toggle('on',sOn);
  document.getElementById('wC').classList.toggle('on',cOn);
  document.getElementById('gX').classList.toggle('on',sOn);
  document.getElementById('gA').classList.toggle('on',cOn);
  document.getElementById('vA').className='val '+(aOn?'on':'');
  document.getElementById('vB').className='val '+(bOn?'on':'');
  document.getElementById('vS').className='val '+(sOn?'on':'off');
  document.getElementById('vC').className='val '+(cOn?'on':'off');
}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){setSpeaker('staff','场务');await type('两个门各管一件事——XOR 管"和"，AND 管"进位"，合起来就会加法。');}
  else if(n===2){setAdder(1,0);await wait(600);setSpeaker('staff','场务');await type('A=1 B=0：XOR 输出 1（和），AND 输出 0（进位）。1+0=1。');}
  else if(n===3){setAdder(1,1);await wait(600);setSpeaker('staff','场务');await type('A=1 B=1：XOR 输出 0（和），AND 输出 1（进位）。1+1=10，进位了！');}
  else if(n===4){setSpeaker('tr','NAND');await type('看，XOR 和 AND 都是我搭的——构成见上页全家福。半加器就这么简单。');}
  else if(n===5){setAdder(0,0);setSpeaker('staff','场务');await type('它叫半加器，因为它不会处理上一位的进位输入。下一场，全加器解决这个。');cont.textContent='Action · 下一场 ▸';}
  if(n<5)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<5){step++;goStep(step);}else{window.location.href='07-全加器-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';setAdder(0,0);setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
