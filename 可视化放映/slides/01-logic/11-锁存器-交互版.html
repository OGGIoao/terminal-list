<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场11·锁存器</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0a;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--muted:#8a8a8e;--amber:#EF9F27;--clk:#7F77DD;--red:#A32D2D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:22px 40px 8px;overflow:hidden}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .title{font-size:23px;font-weight:500;letter-spacing:-.5px;margin-bottom:2px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
  .canvas{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden;padding-bottom:8px}
  .canvas svg{width:100%;max-width:600px;height:auto}
  .wire{stroke:var(--hair);stroke-width:1.5;fill:none;transition:stroke .3s,stroke-width .3s}
  .wire.on{stroke:var(--accent);stroke-width:2.2}
  .blk{fill:#fff;stroke:var(--hair);stroke-width:1.2;transition:all .3s}
  .blk.on{stroke:var(--accent);stroke-width:1.8;fill:rgba(0,47,167,.04)}
  .glbl{font:600 12px ui-sans-serif,system-ui;fill:var(--ink);text-anchor:middle}
  .panetag{font:500 10px ui-monospace,monospace;fill:var(--muted);text-anchor:middle;letter-spacing:1px;text-transform:uppercase}
  .lbl{font:500 11px ui-monospace,monospace;fill:var(--muted)}
  .lbl.key{fill:var(--ink)}
  .val{font:600 15px ui-monospace,monospace;fill:var(--muted);text-anchor:middle}
  .val.on{fill:var(--accent)}
  .val.keep{fill:var(--amber)}
  .nd{fill:var(--ink)}
  .photon{fill:var(--accent);opacity:0}
  .photon.run{animation:fl 1.1s linear infinite}
  @keyframes fl{0%{opacity:0;transform:translateX(0)}25%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(var(--d,80px))}}
  .dock{border-top:1px solid var(--hair);padding:18px 40px;height:156px;position:relative;display:flex;flex-direction:column;justify-content:center}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.nand{color:var(--accent)}
  .speaker.latch{color:var(--amber)}
  .dialogue{font-size:16px;line-height:1.5;min-height:52px;max-width:840px}
  .dialogue .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:40px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:40px;bottom:16px;display:flex;gap:16px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 11 · <b>锁存器</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 最简单的记忆</div>
  <div class="title">锁存器：两个门互相锁定</div>
  <div class="sub">信号撤了状态还在——这就是记忆的本质</div>
  <div class="canvas">
    <svg viewBox="0 0 560 250">
      <text class="panetag" x="280" y="20">SR 锁存器 · 两个或非门交叉耦合</text>
      <!-- S 输入 -->
      <text class="lbl key" x="60" y="82" text-anchor="end">S</text>
      <text class="val" id="LS" x="60" y="66" text-anchor="end">0</text>
      <line class="wire" id="wS" x1="80" y1="78" x2="170" y2="78"/>
      <circle class="photon" id="pS" cx="85" cy="78" r="3" style="--d:85px"/>
      <!-- R 输入 -->
      <text class="lbl key" x="470" y="105" text-anchor="end">R</text>
      <text class="val" id="LR" x="470" y="66" text-anchor="end">0</text>
      <line class="wire" id="wR" x1="470" y1="78" x2="350" y2="78"/>
      <circle class="photon" id="pR" cx="465" cy="78" r="3" style="--d:120px"/>
      <!-- NOR1 (左, 输出 Q) -->
      <rect class="blk" id="g1" x="170" y="55" width="100" height="72" rx="2"/>
      <text class="glbl" x="220" y="99">NOR</text>
      <text class="lbl" x="220" y="48" text-anchor="middle">Q</text>
      <!-- NOR2 (右, 输出 Q') -->
      <rect class="blk" id="g2" x="350" y="55" width="100" height="72" rx="2"/>
      <text class="glbl" x="400" y="99">NOR</text>
      <text class="lbl" x="400" y="48" text-anchor="middle">Q′</text>
      <!-- Q 连接: NOR1 输出(270,91) -> NOR2 输入2(350,104) -->
      <polyline class="wire" id="wQ" points="270,91 310,91 310,104 350,104" fill="none"/>
      <!-- Q' 连接: NOR2 输出(450,91) -> NOR1 输入2(170,104) 绕下方 -->
      <polyline class="wire" id="wQp" points="450,91 510,91 510,188 170,188 170,104" fill="none"/>
      <!-- 输出标签 -->
      <text class="lbl" x="285" y="108" text-anchor="start">Q</text>
      <text class="lbl" x="465" y="108" text-anchor="start">Q′</text>
      <!-- 状态大值 -->
      <text class="val" id="vQ" x="220" y="225" text-anchor="middle">Q = 0</text>
      <text class="val" id="vQp" x="400" y="225" text-anchor="middle">Q′ = 1</text>
    </svg>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="10-时序引入-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="12-D触发器-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
let step=0,typing=false,pending=null,curText='';
const state={Q:0,Qp:1,S:0,R:0};
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  nand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="7" width="13" height="10" rx="2"/><path d="M17 12 h3"/></svg>',
  latch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9 h6 v6 h-6 z"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function $(id){return document.getElementById(id);}
function clearAll(){
  ['wS','wR','wQ','wQp'].forEach(id=>$(id).classList.remove('on'));
  ['pS','pR'].forEach(id=>$(id).classList.remove('run'));
  ['g1','g2'].forEach(id=>$(id).classList.remove('on'));
}
function applyLatch(S,R){
  let Q,Qp;
  if(S&&!R){Q=1;Qp=0;}
  else if(!S&&R){Q=0;Qp=1;}
  else if(!S&&!R){Q=state.Q;Qp=state.Qp;}
  else{return;} // S&&R 非法态，本页不演示
  state.S=S;state.R=R;state.Q=Q;state.Qp=Qp;
  // 输入线 + 光子
  $('wS').classList.toggle('on',S); $('pS').classList.toggle('run',S);
  $('wR').classList.toggle('on',R); $('pR').classList.toggle('run',R);
  $('LS').textContent=S; $('LR').textContent=R;
  $('LS').className='val '+(S?'on':'');
  $('LR').className='val '+(R?'on':'');
  // 门亮
  $('g1').classList.add('on'); $('g2').classList.add('on');
  // Q / Q' 线与值
  $('wQ').classList.toggle('on',Q);
  $('wQp').classList.toggle('on',Qp);
  $('vQ').textContent='Q = '+Q; $('vQ').className='val '+(Q?'on':'keep');
  $('vQp').textContent='Q′ = '+Qp; $('vQp').className='val '+(Qp?'on':'keep');
}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){clearAll();applyLatch(0,0);setSpeaker('staff','场务');await type('两个或非门交叉耦合——互相把对方输出接进自己输入，就能存住 1 位 0 或 1。没有时钟，电平触发。');}
  else if(n===2){applyLatch(1,0);await wait(600);setSpeaker('staff','场务');await type('给 Set 一个脉冲：S=1。看，Q 立刻翻成 1，Q′ 翻成 0。这就是“置位”。');}
  else if(n===3){applyLatch(0,0);await wait(700);setSpeaker('staff','场务');await type('Set 撤回 0 了——但 Q 还是 1、Q′ 还是 0！信号撤了，状态不丢。这就是记忆。');}
  else if(n===4){applyLatch(0,1);await wait(600);setSpeaker('staff','场务');await type('给 Reset 一个脉冲：R=1。Q 翻回 0，Q′ 翻回 1。这就是“复位”。');}
  else if(n===5){applyLatch(0,0);await wait(700);setSpeaker('staff','场务');await type('Reset 撤回 0 了，Q 还是 0——照样记得住。存住后，松手也不变。');}
  else if(n===6){setSpeaker('nand','NAND');await type('又是门搭的——两个或非门互相锁，我就说我能搭出世界（¬‿¬）。');}
  else if(n===7){setSpeaker('latch','锁存器');await type('我记住了，你松手我也不变。');}
  else if(n===8){clearAll();applyLatch(0,0);setSpeaker('staff','场务');await type('但电平触发有个毛病：Set 一直为 1，状态就一直被“钉”着，容易误动作。下一场改成只在时钟跳变那一刻存。');cont.textContent='Action · 下一场 ▸';}
  if(n<8)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<8){step++;goStep(step);}else{window.location.href='12-D触发器-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';state.Q=0;state.Qp=1;state.S=0;state.R=0;clearAll();applyLatch(0,0);setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
