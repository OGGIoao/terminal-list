<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场09·解码器</title>
<style>
  :root{--bg:#fafafa;--ink:#0a0a0b;--accent:#002FA7;--hair:#d0d0d4;--staff:#5F5E5A;--muted:#8a8a8e;--amber:#EF9F27}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hair)}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:500}
  .ngbtn{font-size:11px;letter-spacing:.5px;color:var(--muted);background:none;border:1px solid var(--hair);padding:6px 14px;cursor:pointer;font-family:inherit}
  .ngbtn:hover{border-color:var(--accent);color:var(--accent)}
  .stage{flex:1;display:flex;flex-direction:column;padding:22px 40px 8px;overflow:hidden}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .title{font-size:23px;font-weight:500;letter-spacing:-.5px;margin-bottom:2px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
  .canvas{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden;padding-bottom:8px}
  .canvas svg{width:100%;max-width:520px;height:auto}
  .wire{stroke:var(--hair);stroke-width:1.5;fill:none;transition:stroke .3s,stroke-width .3s}
  .wire.on{stroke:var(--accent);stroke-width:2.2}
  .dec{fill:#fff;stroke:var(--hair);stroke-width:1.2;transition:all .3s}
  .dec.on{stroke:var(--accent);stroke-width:1.8;fill:rgba(0,47,167,.04)}
  .glbl{font:600 13px ui-sans-serif,system-ui;fill:var(--ink);text-anchor:middle}
  .lbl{font:500 11px ui-monospace,monospace;fill:var(--muted)}
  .lbl.key{fill:var(--ink)}
  .lbl.on{fill:var(--accent)}
  .val{font:600 14px ui-monospace,monospace;fill:var(--muted);text-anchor:middle}
  .val.on{fill:var(--accent)}
  .nd{fill:var(--ink)}
  .photon{fill:var(--accent);opacity:0}
  .photon.run{animation:fl 1.1s linear infinite}
  @keyframes fl{0%{opacity:0;transform:translateX(0)}25%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(var(--d,150px))}}
  .dock{border-top:1px solid var(--hair);padding:18px 40px;height:156px;position:relative;display:flex;flex-direction:column;justify-content:center}
  .speaker{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .speaker svg{width:18px;height:18px}
  .speaker .name{font-size:12px;letter-spacing:1px;font-weight:500;text-transform:uppercase}
  .speaker.staff{color:var(--staff)}
  .speaker.tr{color:var(--accent)}
  .dialogue{font-size:16px;line-height:1.5;min-height:52px;max-width:840px}
  .dialogue .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:0}}
  .action{position:absolute;right:40px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.5px;opacity:0;transition:opacity .3s}
  .action.show{opacity:1;color:var(--accent)}
  .nav{position:absolute;left:40px;bottom:16px;display:flex;gap:16px;font-size:11px;letter-spacing:.5px}
  .nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb">场 09 · <b>解码器</b></div>
  <button class="ngbtn" onclick="reset()">NG · 再拍一条</button>
</div>
<div class="stage">
  <div class="kicker">L1 逻辑电路 · 地址到选择</div>
  <div class="title">解码器：二进制地址变成独热码</div>
  <div class="sub">内存寻址的根基——地址给几，第几路就亮，其他全灭</div>
  <div class="canvas">
    <svg viewBox="0 0 520 210">
      <!-- 2位地址 -->
      <circle class="nd" cx="40" cy="70" r="3"/><text class="lbl key" x="32" y="74" text-anchor="end">A0</text>
      <text class="val" id="vA0" x="32" y="60" text-anchor="end">0</text>
      <circle class="nd" cx="40" cy="110" r="3"/><text class="lbl key" x="32" y="114" text-anchor="end">A1</text>
      <text class="val" id="vA1" x="32" y="100" text-anchor="end">0</text>
      <line class="wire" id="wA0" x1="40" y1="70" x2="170" y2="70"/>
      <line class="wire" id="wA1" x1="40" y1="110" x2="170" y2="110"/>
      <!-- 解码器方块 -->
      <rect class="dec" id="dec" x="170" y="40" width="100" height="125" rx="2"/>
      <text class="glbl" x="220" y="100">解码器</text>
      <text class="lbl" x="220" y="115" text-anchor="middle">2-4</text>
      <!-- 4路输出 -->
      <line class="wire" id="wY0" x1="270" y1="60" x2="400" y2="60"/>
      <line class="wire" id="wY1" x1="270" y1="90" x2="400" y2="90"/>
      <line class="wire" id="wY2" x1="270" y1="120" x2="400" y2="120"/>
      <line class="wire" id="wY3" x1="270" y1="150" x2="400" y2="150"/>
      <circle class="photon" id="pY0" cx="275" cy="60" r="3" style="--d:120px"/>
      <circle class="photon" id="pY1" cx="275" cy="90" r="3" style="--d:120px"/>
      <circle class="photon" id="pY2" cx="275" cy="120" r="3" style="--d:120px"/>
      <circle class="photon" id="pY3" cx="275" cy="150" r="3" style="--d:120px"/>
      <text class="lbl key" x="410" y="55">Y0</text><text class="val" id="vY0" x="445" y="65">0</text>
      <text class="lbl key" x="410" y="85">Y1</text><text class="val" id="vY1" x="445" y="95">0</text>
      <text class="lbl key" x="410" y="115">Y2</text><text class="val" id="vY2" x="445" y="125">0</text>
      <text class="lbl key" x="410" y="145">Y3</text><text class="val" id="vY3" x="445" y="155">0</text>
      <text class="lbl" x="220" y="185" text-anchor="middle">2 位地址 → 4 路独热输出</text>
    </svg>
  </div>
</div>
<div class="dock">
  <div class="speaker staff" id="spk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>
    <span class="name">场务</span>
  </div>
  <div class="dialogue" id="dlg"><span class="cursor"></span></div>
  <div class="nav"><a href="08-MUX多路复用器-交互版.html">‹ 上一页</a><a href="../逻辑电路卷目录.html">目录</a><a href="10-时序引入-交互版.html">下一页 ›</a></div>
  <div class="action" id="cont">Action ▸</div>
</div>
<script>
const dlg=document.getElementById('dlg'),spk=document.getElementById('spk'),cont=document.getElementById('cont');
let step=0,typing=false,pending=null,curText='';
const icons={
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5 h13 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-1 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/></svg>',
  tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="12" x2="11" y2="12"/><line x1="11" y1="7" x2="11" y2="17"/><line x1="13" y1="8" x2="13" y2="11"/><line x1="13" y1="13" x2="13" y2="16"/><line x1="13" y1="9" x2="20" y2="9"/><line x1="13" y1="15" x2="20" y2="15"/></svg>'
};
function setSpeaker(r,n){spk.className='speaker '+r;spk.innerHTML=icons[r]+'<span class="name">'+n+'</span>';}
function type(t){curText=t;typing=true;return new Promise(res=>{pending=res;let i=0;dlg.innerHTML='<span class="cursor"></span>';const tick=()=>{if(!typing)return;if(i<t.length){dlg.innerHTML=t.slice(0,i+1)+'<span class="cursor"></span>';i++;setTimeout(tick,32);}else{typing=false;pending=null;res();}};tick();});}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function clearAll(){
  ['wA0','wA1','wY0','wY1','wY2','wY3'].forEach(id=>document.getElementById(id).classList.remove('on'));
  ['pY0','pY1','pY2','pY3'].forEach(id=>document.getElementById(id).classList.remove('run'));
  document.getElementById('dec').classList.remove('on');
  ['vA0','vA1','vY0','vY1','vY2','vY3'].forEach(id=>document.getElementById(id).className='val');
}
function decode(a0,a1){
  clearAll();
  document.getElementById('vA0').textContent=a0;document.getElementById('vA1').textContent=a1;
  if(a0)['wA0'].forEach?null:null;document.getElementById('wA0').classList.toggle('on',a0);
  document.getElementById('wA1').classList.toggle('on',a1);
  document.getElementById('dec').classList.add('on');
  const idx=a1*2+a0;
  document.getElementById('wY'+idx).classList.add('on');
  document.getElementById('pY'+idx).classList.add('run');
  document.getElementById('vY'+idx).textContent=1;
  document.getElementById('vY'+idx).className='val on';
  for(let i=0;i<4;i++){if(i!==idx){document.getElementById('vY'+i).textContent=0;}}
}
async function goStep(n){
  cont.classList.remove('show');cont.textContent='Action ▸';
  if(n===1){clearAll();['vA0','vA1'].forEach(id=>document.getElementById(id).textContent='0');['vY0','vY1','vY2','vY3'].forEach(id=>document.getElementById(id).textContent='0');setSpeaker('staff','场务');await type('MUX 是选输入，解码器反过来——给个地址，选中一路输出。它是内存寻址的根基。');}
  else if(n===2){decode(0,0);await wait(600);setSpeaker('staff','场务');await type('地址 A1A0=00：选中第 0 路，Y0=1，其他全 0。这叫独热码——只有一位是 1。');}
  else if(n===3){decode(0,1);await wait(600);setSpeaker('staff','场务');await type('地址变 10：选中第 2 路，Y2=1，其他全灭。地址给几，第几路亮。');}
  else if(n===4){decode(1,1);await wait(600);setSpeaker('tr','解码器');await type('内存里每个单元都有地址，我就是那个按地址开门的(¬‿¬)。');}
  else if(n===5){clearAll();['vA0','vA1','vY0','vY1','vY2','vY3'].forEach(id=>{document.getElementById(id).textContent='0';document.getElementById(id).className='val';});setSpeaker('staff','场务');await type('到这为止，电路都是即时反应——输入一变输出立刻变，没有记忆。但算账要存中间结果啊。下一场，电路要会记忆了。');cont.textContent='Action · 下一场 ▸';}
  if(n<5)cont.classList.add('show');
}
function advance(){if(typing){typing=false;dlg.innerHTML=curText+'<span class="cursor"></span>';if(pending){pending();pending=null;}return;}if(step<5){step++;goStep(step);}else{window.location.href='10-时序引入-交互版.html';}}
function reset(){step=0;typing=false;pending=null;curText='';clearAll();['vA0','vA1','vY0','vY1','vY2','vY3'].forEach(id=>{document.getElementById(id).textContent='0';});setSpeaker('staff','场务');dlg.innerHTML='<span class="cursor"></span>';cont.textContent='喊 Action 开拍 ▸';cont.classList.add('show');}
document.addEventListener('click',advance);
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();advance();}else if(e.code==='Backspace'||e.code==='ArrowLeft'){e.preventDefault();reset();}});
reset();
</script>
</body>
</html>
